spring:
  application:
    name: backend
  config:
    # IDE 에서 띄우면 저장소 루트의 .env 를 읽는다 — compose 가 DB 컨테이너에 넣는 값과 같은 파일이다.
    # compose 의 backend 컨테이너는 이 파일 대신 환경변수로 받는다 (환경변수가 이긴다).
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      data-source-properties:
        # backend 연결에만 넘기는 PostgreSQL 세션 설정(PgJDBC options). 사이트 값은 infra/k8s/services/app/backend.yaml 의
        # DB_OPTIONS 가 정한다 — Jira S15P31A102-230 에서 "-c jit=off" 로 둔다.
        # 화면 쿼리는 수 ms 짜리인데, 추정 비용이 JIT 문턱(기본 10만)을 넘으면 실행마다 컴파일했다 — 2026-11-17 운영에서
        # 앱 SQL 을 PREPARE 해 잰 값: A1 분야별 이슈 수 28.6 → 13.3 ms · A13 검색 이슈 칸 14.2 → 0.9 · 사건 칸 10.9 → 4.7.
        # 비면 빈 options 가 가서 서버 기본값 그대로다(로컬 · CI). DB 서버 설정 · psql 스크립트는 건드리지 않는다.
        # 운영 · CI 에서는 Flyway 도 이 연결을 써서 마이그레이션도 같은 설정이다 — DDL 은 JIT 대상이 아니고, 데이터를 고치는
        # 마이그레이션(UPDATE · INSERT)은 JIT 없이 돌아 속도만 다르고 결과는 같다. 로컬 Testcontainers 의 Flyway 는 따로 붙어 값이 안 간다.
        # 되돌리기는 backend.yaml 의 DB_OPTIONS 값을 "" 로
        options: ${DB_OPTIONS:}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션(db/migration)만 바꾼다
      ddl-auto: validate
  # Redis 세션의 만료. 내장 서버로 뜰 때는 server.servlet.session.timeout 을 대신 쓰지만, 내장 서버 없이 도는
  # MockMvc 시험에서는 그러지 않아 30분이 된다 — 둘을 같이 하루로 둔다(Spring Boot 4.1.1)
  session:
    timeout: 1d
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis 가 멈추면 명령이 이만큼 기다리다 실패한다(Lettuce 기본 60초) — 로그인 · 세션을 쓰는 요청이 오래 매달리지 않게.
      # backend 는 막아 두고 읽는 명령이 없다(큐는 XADD 만, 읽기는 AI 워커) (Jira 145)
      timeout: 3s
      # 다시 붙을 때 한 번 시도의 상한(기본 10초) — 2026-11-02 Redis 재시작 실측에서 다시 붙는 데 약 10초 걸렸다.
      # 다시 붙는 간격은 RedisClientConfig (Jira 145)
      connect-timeout: 2s
  devtools:
    livereload:
      enabled: false
  # 끝낼 때 받은 요청을 마무리하는 시간의 상한(기본 30초). 사이트는 preStop 10초 + 이 20초 = 30초가
  # 쿠버네티스 유예 40초(infra/k8s/services/app/backend.yaml) 안에 들게 한다 — 기본값이면 40초에 딱 맞물려 강제 종료와 겹친다 (Jira 29)
  lifecycle:
    timeout-per-shutdown-phase: 20s

# 로그인 세션(Jira 62) — 로그인한 때부터 하루. Redis 세션 만료와 쿠키 Max-Age 를 같이 하루로 둔다
# 사이트는 Envoy 가 TLS 를 풀고 앱은 http 로 받아서, Secure 는 env 로 직접 켠다(infra/k8s/services/app/backend.yaml)
server:
  # 끝낼 때 새 요청은 받지 않고 받은 요청은 마무리한다. 기본값이지만 위 20초 상한과 짝이라 적어 둔다 (SSOT.md 6절 「무중단 배포 조건」)
  shutdown: graceful
  servlet:
    session:
      timeout: 1d
      cookie:
        max-age: 1d
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

# 쿠버네티스 프로브가 묻는 전용 주소 (Jira 29) — /actuator/health/liveness · /readiness 는 스프링이 기본으로 연다
# readiness(「요청을 받아도 되나」)는 DB 만 본다. DB 가 안 되면 Envoy 가 이 Pod 로 요청을 보내지 않는다 (SSOT.md 6절)
# Redis 는 빼 둔다 — Redis 가 멈춰도 손님 조회는 계속 받는다. 세션을 읽는 요청(로그인 · 가입 · 회원을 읽는 화면 API)은
# 명령 대기(3초) 뒤 500, 용어사전 · 작업 큐 넣기는 Redis 를 건너뛰거나 나중에 다시 넣는다(범위는 SSOT.md 6절).
# 전체 /actuator/health 는 Redis 를 계속 보여 준다 (2026-11-02 Jira 145)
# liveness(「살아 있나」)는 앱 상태만 본다 — DB 가 잠깐 끊겼다고 재시작하지 않게
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db

# 직원용 문(/internal/**) 출입증 두 장 (Jira 30) — 워커 키는 W1, 배치 키는 B2 · B1 만 연다. 비어 있으면 모두 막는다
# 사이트는 봉인 Secret internal-api 를 env 로 넣는다(Jira 30 의 Infra 작업, 넣기 전에는 비어 모두 막힘). 로컬은 루트 .env
newlearn:
  internal:
    worker-key: ${INTERNAL_WORKER_KEY:}
    batch-key: ${INTERNAL_BATCH_KEY:}
  # 용어사전(A19, Jira 102) — 국립국어원 표준국어대사전 Open API 인증 키. 비어 있으면 사전을 부르지 않고 502 DICTIONARY_UNAVAILABLE
  # 사이트는 사이트 반영 때 봉인 Secret 을 env 로 넣는다(Infra). 로컬은 루트 .env
  dictionary:
    stdict-key: ${STDICT_API_KEY:}
    # 사전을 하루에 부르는 수의 상한 — Open API 한도 50,000건의 90%. 넘으면 그날은 부르지 않고 502 (Jira 135)
    daily-limit: 45000
    # 드래그한 말의 문맥 뜻(A26, Jira 187) — SSAFY GMS. 주소 · 모델은 AI 워커와 같은 값(infra/k8s/services/ai/ai.yaml)이고
    # 키는 env 로만 받는다. 비어 있으면 GMS 를 부르지 않고 502. 사이트는 backend.yaml 이 넣는다(키는 봉인 Secret gms-api)
    meaning:
      gms-base-url: ${GMS_BASE_URL:}
      gms-api-key: ${GMS_API_KEY:}
      gms-model: ${GMS_MODEL:gpt-6-luna}
      # 하루에 GMS 를 부르는 수의 상한(팀 공용 예산). 0 이면 GMS 를 부르지 않는다 — 끄는 스위치
      daily-limit: ${MEANING_DAILY_LIMIT:3000}
  query:
    # 화면에 보일 사건의 최소 공개 기사 수 (Jira S15P31A102-206 후속). 1 이면 지금까지와 같다(공개 기사가 하나라도 있으면 보임, Jira 179).
    # 2026-11-14 측정: 3 으로 두면 이슈 쌍 정밀도 0.930 → 0.976 · F1 0.841 → 0.874. 사이트는 3 으로 켠다.
    # 기준은 사건 단위다 — 공개 기사 N건 이상인 사건만 보이고, 그런 사건이 없는 이슈는 없는 것으로 본다(A2 · A3 · A4 · A5 · A13 · A1 · A23 · A25)
    min-public-articles: ${QUERY_MIN_PUBLIC_ARTICLES:1}
    # 이슈가 목록에 나오려면 보이는 사건이 몇 개 있어야 하는가 (Jira S15P31A102-208). 1 이면 지금까지와 같다.
    # 이슈는 사건 3개 이상일 때만 만들어지는데(AI 워커 CREATE_MIN_EVENTS) 만든 뒤 사건이 빠지면 1 ~ 2개만 남는다 —
    # 2026-11-15 운영에서 보이는 이슈 225개 중 26개(11.6%)가 그랬다. 사이트는 3 으로 켠다(225 → 199).
    # 기사 문턱과 달리 목록에서만 뺀다 — A2 · A1 · A13 의 이슈 칸. 이슈 페이지(A3 · A4)와 이슈 링크(A5 · A8),
    # 관심 이슈(A23 · A25)는 그대로다. 주소를 알고 들어오면 열린다
    min-public-events: ${QUERY_MIN_PUBLIC_EVENTS:1}
    # 이슈가 목록에 나오려면 보이는 사건 중 메인 흐름(MAIN) 사건이 몇 개 있어야 하는가 (Jira S15P31A102-224). 0 이면 끔(지금까지와 같다).
    # 서브 흐름(반응 · 평가 · 여론)만 있으면 「무슨 일이 있었나」가 없어 흐름이 서지 않는다 — 2026-11-16 운영에서 보이는 이슈
    # 201개 중 10개(정치권 공방이 대부분). 사이트는 1 로 켠다(201 → 191). 사건 수 문턱과 같은 자리(A2 · A1 · A13 이슈 칸)에서만 뺀다
    min-main-events: ${QUERY_MIN_MAIN_EVENTS:0}
  analysis:
    issue:
      # 이슈 붙이기(ATTACH)가 기존 이슈의 요약을 다시 쓰고 분야를 다시 계산할지 (Jira S15P31A102-207).
      # 기본은 계약대로 true(docs/api-internal.md 5절). 사이트는 발표(11-18)까지 false 로 둔다 —
      # 사건은 이슈에 붙이되 발표에 쓸 요약 · 분야는 그대로. 분야 다시 계산은 고정 28개 목록을 보지 않는다
      rewrite-summary-on-attach: ${ISSUE_REWRITE_SUMMARY_ON_ATTACH:true}
      # 후보 이슈로 올릴 코사인 거리의 상한 (Jira S15P31A102-206 후속). `<=>` 는 0 ~ 2 라 2.0 이 「끔」이다.
      # 2026-11-14 측정: 이슈에 잘못 붙은 34건 중 넷이 유사도 0.60(거리 0.40) 아래였고, 그 아래를 버려도
      # 맞게 붙은 1,364건은 하나도 잃지 않는다. 사이트는 0.40 으로 켠다
      max-candidate-distance: ${ISSUE_MAX_CANDIDATE_DISTANCE:2.0}
      # 이슈 판정 CREATE 의 사건 중 메인 흐름(MAIN)이 몇 개 있어야 이슈를 만드는가 (Jira S15P31A102-224). 0 이면 끔.
      # 모자라면 이슈를 만들지 않고 NONE 처럼 끝낸다(사건은 이슈 밖에 남아 다음 새 사건 때 다시 후보가 된다). 사이트는 1.
      # 되돌려도 그동안 막힌 묶음은 다시 생기지 않는다 — ISSUE 는 새 사건에만 걸린다
      create-min-main-events: ${ISSUE_CREATE_MIN_MAIN_EVENTS:0}

# Swagger(springdoc) — 개발하는 동안 로그인 없이 연다 (SSOT.md 6절 「공개 화면」, Jira 107)
# 내부 API(/internal/v1)는 밖에 열지 않는 주소라 문서에서도 뺀다
springdoc:
  paths-to-exclude: /internal/**
  # Swagger 화면에서 POST 를 누를 때 XSRF-TOKEN 쿠키 값을 X-XSRF-TOKEN 헤더로 붙여 준다
  swagger-ui:
    csrf:
      enabled: true
  # 응답 본문 종류를 */* 가 아니라 실제와 같게 보인다
  default-produces-media-type: application/json
