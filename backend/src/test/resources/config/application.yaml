# 시험에만 덧씌우는 설정 — src/main/resources/application.yaml 위에 얹힌다(classpath:/config/ 가 더 앞선다)
# 분석 작업 스케줄러(Jira 30)는 끈다. 1분마다 돌면 시험이 보고 있는 작업을 다시 걸 수 있어서다
# 스케줄러가 하는 일은 AnalysisJobService.retryDue · publishUnpublished 에 시각을 넘겨 시험한다
newlearn:
  analysis:
    scheduler:
      enabled: false

# 시험용 앱 하나의 DB 연결을 4개까지로(기본 10). 시험 클래스마다 설정이 다르면 Spring 이 시험용 앱을 따로 띄워 들고 있는데,
# CI 잡은 DB 하나(.gitlab-ci.yml 의 services)를 모든 시험용 앱이 같이 써서 앱이 10개를 넘으면 PostgreSQL 기본 상한(100)에
# 걸려 「too many clients」로 실패했다(2026-10-27 Jira 35, MR !274). 로컬은 앱마다 컨테이너를 새로 띄워 걸리지 않는다.
# 동시성 시험은 한 번에 연결 2 ~ 3개를 쓴다
spring:
  datasource:
    hikari:
      maximum-pool-size: 4
