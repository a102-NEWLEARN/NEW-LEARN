# CI 게이트 — GitHub Actions. 저장소 루트 기준 .github/workflows/gate.yml 로 둔다.
#
# 검사 명령은 여기 적지 않는다. 아래 두 줄이 .claude/stack.md §3 의 명령을 읽어 돌린다.
# 로컬 훅과 CI 가 같은 명령을 써야 「로컬은 되는데 CI 는 안 되는」 일이 없다.
# 명령을 바꾸려면 stack.md 를 고친다. 두 층(fast · slow)에서 무엇이 도는지는 stack.md §4.
#
# 🔴 머지를 막으려면 브랜치 보호(또는 룰셋)의 필수 검사에 fast 와 slow 를 둘 다 건다.
# convention 을 켰으면 그것도 건다. slow 만 걸면 fast 가 실패해 slow 가 건너뛰어질 때
# GitHub 은 건너뜀을 통과로 친다.
# 사설 저장소는 Free 요금제에 브랜치 보호 · 룰셋이 없다 (Pro · Team 이상). 그때 CI 는 알리기만 한다.
#
# 액션은 전부 40자 커밋 SHA 로 고정하고 버전을 주석으로 단다. 태그는 옮겨질 수 있다 —
# 2026-03 trivy-action 은 태그 대부분이 악성 커밋으로 옮겨졌고 SHA 로 고정한 저장소만 무사했다.
# 낡은 SHA 는 Dependabot 이 올린다 (.claude/ci/dependabot.yml). 저장소 설정의
# 「Require actions to be pinned to a full-length commit SHA」를 켜면 고정을 강제한다.
#
# pull_request_target 트리거는 쓰지 않는다. 포크 PR 의 코드를 쓰기 토큰 · 비밀값과 같이 돌린다.
#
# 잡을 더 쪼개기 전에 stack.md §4 「러너가 동시에 몇 개」를 먼저 채운다.
# 잡을 쪼개도 러너가 남을 때만 빨라진다.

name: gate

on:
  pull_request:
  push:
    branches: [main]   # 🔴 기본 브랜치 이름이 다르면 바꾼다 (stack.md §3 DEFAULT_BRANCH)
  # 머지 큐를 켜면 주석을 푼다. 기본 브랜치가 자주 움직여서 PR 마다 브랜치를 갱신하고 검사를
  # 다시 돌리게 될 때 쓴다. 큐가 앞 PR 과 합친 결과로 검사하고 순서대로 머지한다.
  # 조직 소유 공개 저장소나 GHEC 사설 저장소에서만 된다. 안 풀면 큐에 든 PR 의 검사가 안 돌아 머지가 멈춘다.
  # merge_group:

# 워크플로 기본 권한은 0 이다. 잡마다 필요한 것만 연다 — 잡을 더할 때 넓은 권한이 따라가지 않게.
# 배포 · 레지스트리 푸시 잡은 그 잡에만 packages: write · id-token: write 같은 권한을 준다.
permissions: {}

# 새 커밋이 오면 그 PR 의 옛 실행을 취소한다. 쓸모없어진 잡이 러너를 붙들지 않게.
# 기본 브랜치는 취소하지 않는다. PR 에서 놓친 것을 잡는 마지막 자리다.
# 그래서 push 는 실행마다 그룹을 따로 둔다. 한 그룹에 묶으면 대기 중인 실행이 다음 실행에 밀려 취소된다.
concurrency:
  group: gate-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    # 기본 360분이면 멈춘 잡이 러너를 6시간 붙든다. stack.md §4 「잡 하나가 걸리는 시간」을 재면 그 2~3배로 줄인다.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # 시크릿 스캔이 PR 의 커밋 이력을 기준 커밋까지 본다
          persist-credentials: false  # 원격에 다시 붙지 않는다. 설치 스크립트가 토큰을 못 읽게

      # 🔴 프로젝트의 런타임을 여기 깐다. 언어마다 달라 하네스가 대신 정할 수 없는 자리다.
      # 아래 slow 와 같게 둔다. 의존성 설치는 stack.md 의 <영역>_INSTALL 이 하니 적지 않는다.
      #
      #    예) SHA 는 2026-10-10 기준. Dependabot 이 올린다
      #      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      #        with:
      #          node-version: '22'
      #
      #      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      #        with:
      #          python-version: '3.12'
      #
      #      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      #        with:
      #          go-version-file: go.mod
      #
      # 캐시는 재 보고 이득이 큰 영역에만 켠다. 매번 압축 · 복원하는 시간도 든다.
      # 어떤 프로젝트에서는 gradle 은 빨라지고 npm 은 오히려 느려졌다. 재 본 숫자는 stack.md §4 에 적는다.
      # setup-* 액션의 cache 는 잠금 파일 해시가 키라서 의존이 바뀌면 새로 받는다.
      #
      #      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      #        with:
      #          distribution: temurin
      #          java-version: '21'
      #          cache: gradle
      #
      # 자체 호스팅 러너면 러너 v2.327.1 이상이어야 한다 (위 액션들이 node24 로 돈다).
      #
      # 아래 줄은 채우기 전까지 일부러 실패한다. 빠뜨리면 러너에 깔린 기본 버전으로 돌아 로컬과 다른 초록이 뜬다.
      - name: 런타임 설치 (채우기 전에는 실패)
        run: echo '🔴 .claude/ci 의 런타임 설치 단계를 채우고 이 줄을 지운다' && exit 1

      # stack.md 와 상관없이 하네스 자신을 검사한다. 무엇을 보는지는 .claude/README.md 의 hooks/ 표.
      # slow 는 fast 가 초록일 때만 떠서 거기서 다시 돌리지 않는다.
      - name: 하네스 자체 검사
        run: bash .claude/hooks/tests/run.sh

      # 이 워크플로 파일이 깨지면 게이트가 통째로 안 돈다. actionlint 는 문법 · 표현식을,
      # zizmor 는 권한 · 주입 · 고정 안 한 액션 같은 보안 실수를 본다. 둘 다 무료다.
      # 도구 이미지도 digest 로 고정한다. 스캐너 이미지가 악성으로 바뀐 적이 있다.
      - name: 워크플로 검사 (actionlint · zizmor)
        env:
          GH_TOKEN: ${{ github.token }}   # zizmor 의 온라인 검사(가짜 SHA 등). 읽기 권한이면 된다
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
          docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 \
            --min-severity=medium .github/workflows

      - name: 빠른 층 (시크릿 → 설치 → 포맷 → 린트)
        env:
          # PR 이면 대상 브랜치 끝 뒤로 쌓인 커밋에서도 시크릿을 찾는다. push 는 비어서 건너뛴다
          SCAN_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash .claude/hooks/pre-commit --ci-fast

  slow:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 위 fast 와 같은 런타임을 깐다.
      - name: 런타임 설치 (채우기 전에는 실패)
        run: echo '🔴 .claude/ci 의 런타임 설치 단계를 채우고 이 줄을 지운다' && exit 1

      - name: 전체 (시크릿 → 설치 → 포맷 → 린트 → 테스트 → 빌드)
        run: bash .claude/hooks/pre-commit --ci

  # ---------------------------------------------------------------------------
  # 커밋 · 브랜치 · PR 제목 규칙 — stack.md §3 에 적었을 때만
  # ---------------------------------------------------------------------------
  # 규칙을 적었으면 주석을 푼다. 안 적었으면 이 잡은 볼 것이 없다.
  # 로컬 커밋 훅은 훅을 안 깐 사람 · --no-verify · cherry-pick · rebase 를 못 막는다. PR 에서 한 번 더 본다.
  # 검사기 회귀 테스트는 fast 의 하네스 자체 검사가 같이 돌린다.
  #
  # PR 제목만 고쳐도 다시 돌게 하려면 이 잡을 별도 파일 .github/workflows/convention.yml 로 옮기고
  # on: pull_request: types: [opened, synchronize, reopened, edited] 로 받는다. 위 permissions 도 같이 옮긴다.
  # 이 파일에 edited 를 넣으면 제목만 고쳐도 fast · slow 가 취소되고 다시 돈다.
  #
  # convention:
  #   if: github.event_name == 'pull_request'
