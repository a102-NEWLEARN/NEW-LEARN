  #     contents: read
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         fetch-depth: 0              # PR 의 커밋과 대상 브랜치를 다 받는다. mr-check 가 다시 받지 않는다
  #         persist-credentials: false
  #
  #     - name: 규칙 검사 (브랜치 · 커밋 · PR 제목)
  #       run: bash .claude/hooks/mr-check.sh
  #       env:
  #         # mr-check 는 제목을 이 이름으로 받는다. run 줄에 직접 넣으면 제목 속 셸 문법이 실행된다
  #         CI_MERGE_REQUEST_TITLE: ${{ github.event.pull_request.title }}

  # ---------------------------------------------------------------------------
  # 영역이 여럿일 때 — 영역마다 병렬로, PR 에서는 바뀐 영역만
  # ---------------------------------------------------------------------------
  # 위 fast · slow 를 지우고 아래 다섯 잡을 쓴다. 러너가 남을 때만 빨라진다 (stack.md §4).
  # 영역 경로는 다시 적지 않는다. pre-commit --changed-areas 가 stack.md 를 읽어 바뀐 영역을 고른다.
  # 기준 커밋을 못 찾거나, .claude/ · 워크플로 · 영역 밖의 문서 아닌 파일(루트 잠금 파일 · Dockerfile)이
  # 바뀌면 전 영역을 고른다. 기본 브랜치 push 도 전 영역이다.
  #
  # 🔴 브랜치 보호의 필수 검사에는 맨 아래 gate 하나만 건다. 영역 잡은 PR 마다 건너뛸 수 있어서
  #    필수로 걸면 건너뛴 날 「대기 중」에서 멈춘다. on: 의 paths 로 워크플로를 통째로 건너뛰어도 같다.
  # 🔴 영역 잡은 시크릿 스캔을 건너뛴다(같은 스캔을 영역 수만큼 되풀이하지 않게). 그래서 저장소 전체를
  #    보는 harness 잡을 조건 없이 늘 띄운다. 이 잡을 지우면 아무도 시크릿을 안 본다.
