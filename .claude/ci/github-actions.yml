  # ---------------------------------------------------------------------------
  # 이미지로 배포한다면 — 굽고 → 검사하고 → 커밋 SHA 태그로 올린다 (stack.md §6)
  # ---------------------------------------------------------------------------
  # 검사를 통과한 이미지만 레지스트리에 오른다. 태그가 커밋 SHA 라서 되돌리기는 옛 태그를 다시 받는 일이다.
  # SBOM(이미지 안 부품 목록)과 provenance(어느 커밋 · 워크플로가 구웠나)를 같이 붙인다. 요금제와 상관없다.
  # provenance 의 mode=max 는 build-arg 값을 그대로 싣는다. 비밀값은 build-arg 가 아니라 secrets 로 넘긴다.
  #
  # image:
  #   needs: slow
  #   if: github.event_name == 'push'
