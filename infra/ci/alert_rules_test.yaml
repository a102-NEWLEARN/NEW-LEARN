# 경보 규칙 단위 시험 — promtool test rules (Jira S15P31A102-139). 돌리는 법은 옆의 alert_rules.sh
# rules.yaml 은 alert_rules.sh 가 infra/k8s/alerts/rules.yaml 의 spec 아래를 꺼내 이 파일 옆에 둔 것이다
# 시각은 시험 시작(0초)부터 잰다. time() 도 0 에서 시작한다
# 시험마다 「아직 안 울림」과 「울림」을 같이 본다. promtool 은 울리는 중(firing)인 경보만 비교한다 — 기다리는 중(pending)은 빈 목록과 같다
# 값 적는 법: 1x3 은 1 이 네 번(interval 30s 면 0 · 30초 · 1분 · 1분 30초), _x3 은 빈칸 세 번, stale 은 끊김 표시 하나
# 주석(summary · description)도 글자 그대로 비교한다 — rules.yaml 의 주석을 바꾸면 여기도 바꾼다
rule_files:
  - rules.yaml

# 클러스터와 같다(2026-10-30 Prometheus 의 evaluationInterval · scrapeInterval 30s)
evaluation_interval: 30s

tests:
  # 상한 풀림 수가 처음 생길 때 — Envoy 는 처음 풀릴 때 그 수의 줄을 새로 만든다. increase() 였으면 첫 묶음을 놓친다
  - name: 상한 풀림 수 첫 등장
    interval: 30s
    input_series:
      # 0 ~ 9분 30초 줄 없음, 10분에 1 로 생김
      - series: envoy_cluster_ratelimit_failure_mode_allowed{envoy_cluster_name="ratelimit_cluster"}
        values: "_x20 1x60"
    alert_rule_test:
      # 10분부터 참이지만 for 2m 이 아직 안 참
      - eval_time: 11m30s
        alertname: NewlearnRateLimitFailOpen
      - eval_time: 12m
        alertname: NewlearnRateLimitFailOpen
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: warning
            exp_annotations:
              summary: 입구 요청 수 상한이 풀렸다 — 상한 서비스를 못 불러 요청을 그냥 통과시켰다
              description: "kubectl -n envoy-gateway-system get pod 와 data/redis 를 본다. 질의는 SSOT 6절 「외부 입구」"
      # 10분 뒤에는 offset 쪽도 1 이라 차이가 0 — 풀림
      - eval_time: 21m
        alertname: NewlearnRateLimitFailOpen

  # Envoy 수집이 한 번 실패하면 끊김 표시(stale)가 남고, 10분 뒤 offset 쪽이 한 평가(30초) 동안 비어 or vector(0) 이 0 을 넣는다
  # 예전에 풀려 쌓인 수가 있으면 그 30초 동안 식이 참이다 — for 2m 덕에 울리지 않아야 한다 (리뷰 2026-10-30)
  - name: 수집 한 번 놓침은 안 울림
    interval: 30s
    input_series:
      # 쌓인 5 가 이어지다 20분 30초에 수집 한 번 실패, 21분부터 다시 5
      - series: envoy_cluster_ratelimit_failure_mode_allowed{envoy_cluster_name="ratelimit_cluster"}
        values: "5x40 stale 5x40"
    alert_rule_test:
      # 처음 10분은 offset 쪽 기록이 없어 시험에서만 울린다(실제로는 앞선 기록이 있다) — 그 뒤만 본다
      - eval_time: 12m
        alertname: NewlearnRateLimitFailOpen
      # 30분 30초에 offset 쪽(20분 30초)이 비어 식이 참 — 기다리는 중
      - eval_time: 30m30s
        alertname: NewlearnRateLimitFailOpen
      - eval_time: 33m
        alertname: NewlearnRateLimitFailOpen

  # 수집 대상 둘(Envoy · 상한 서비스)을 대상마다 absent 로 본다 — 풀림 수를 내는 Envoy 대상만 빠져도 울려야 한다 (리뷰 2026-10-30)
  - name: 수집 대상 하나만 사라짐
    interval: 30s
    input_series:
      # Envoy 대상이 5분 30초에 목록에서 빠짐(끊김 표시 뒤 줄이 없음)
      - series: up{namespace="envoy-gateway-system", job="envoy-gateway-system/envoy-proxy-ratelimit", pod="envoy-public"}
        values: "1x10 stale"
      - series: up{namespace="envoy-gateway-system", job="envoy-gateway-system/envoy-ratelimit", pod="envoy-ratelimit"}
        values: "1x40"
    alert_rule_test:
      - eval_time: 5m
        alertname: NewlearnRateLimitMetricsMissing
      # 5분 30초부터 없음, for 5m 이 아직 안 참
      - eval_time: 10m
        alertname: NewlearnRateLimitMetricsMissing
      - eval_time: 11m
        alertname: NewlearnRateLimitMetricsMissing
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: warning
              namespace: envoy-gateway-system
              job: envoy-gateway-system/envoy-proxy-ratelimit
            exp_annotations: &missing
              summary: 입구 상한 지표를 못 모은다 — 상한 풀림 경보를 믿을 수 없다
              description: "PodMonitor 는 infra/k8s/gateway/ratelimit-podmonitor.yaml. Prometheus 화면 Status › Targets 에서 envoy-gateway-system 을 본다"

  # 반대쪽 — 상한 서비스 대상만 빠져도 그 job 으로 울린다
  - name: 상한 서비스 대상만 사라짐
    interval: 30s
    input_series:
      - series: up{namespace="envoy-gateway-system", job="envoy-gateway-system/envoy-proxy-ratelimit", pod="envoy-public"}
        values: "1x40"
      - series: up{namespace="envoy-gateway-system", job="envoy-gateway-system/envoy-ratelimit", pod="envoy-ratelimit"}
        values: "1x10 stale"
    alert_rule_test:
      - eval_time: 10m
        alertname: NewlearnRateLimitMetricsMissing
      - eval_time: 11m
        alertname: NewlearnRateLimitMetricsMissing
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: warning
              namespace: envoy-gateway-system
              job: envoy-gateway-system/envoy-ratelimit
            exp_annotations: *missing

  # 루트 디스크 80% 넘김 — kubelet 이 이미지 정리 · Pod 축출을 시작하는 85% 전에 알린다
  - name: 디스크 80% 넘김
    interval: 30s
    input_series:
      # 0 ~ 20분 79% 사용, 20분 30초부터 81%
      - series: node_filesystem_avail_bytes{instance="node:9100", mountpoint="/", fstype="ext4"}
        values: "21x40 19x40"
      - series: node_filesystem_size_bytes{instance="node:9100", mountpoint="/", fstype="ext4"}
        values: "100x81"
    alert_rule_test:
      - eval_time: 20m
        alertname: NewlearnDiskAlmostFull
      # 20분 30초부터 참, for 10m 이 아직 안 참
      - eval_time: 30m
        alertname: NewlearnDiskAlmostFull
      - eval_time: 31m
        alertname: NewlearnDiskAlmostFull
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: warning
              instance: node:9100
              mountpoint: /
              fstype: ext4
            exp_annotations:
              summary: "노드 node:9100 루트 디스크 81% 사용"
              description: "df -h / · sudo du -xh --max-depth=2 /var/lib | sort -h | tail 로 큰 곳을 본다. 이미지 정리는 infra/server/alerts.md 「디스크 경보가 오면」대로(--prune 은 CI 이미지까지 지운다)"

  # 매일 백업(04:00)이 26시간 넘게 성공하지 못함. 값은 마지막 성공 시각(초)이다
  - name: 매일 백업 26시간 넘김
    interval: 1m
    input_series:
      # 0초에 성공한 뒤 다음 날 백업이 실패해 그대로
      - series: kube_cronjob_status_last_successful_time{namespace="data", cronjob="postgres-backup"}
        values: "0x1700"
      # 주간 S3 는 늘 방금 성공(값 = 지금 시각)
      - series: kube_cronjob_status_last_successful_time{namespace="data", cronjob="postgres-backup-s3"}
        values: "0+60x1700"
    alert_rule_test:
      - eval_time: 25h59m
        alertname: NewlearnBackupMissing
      # 26시간 30초부터 참, for 10m 이 아직 안 참
      - eval_time: 26h10m
        alertname: NewlearnBackupMissing
      - eval_time: 26h11m
        alertname: NewlearnBackupMissing
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: critical
              namespace: data
              cronjob: postgres-backup
            exp_annotations:
              summary: "DB 백업 postgres-backup 의 마지막 성공이 1d 2h 11m 0s 전이다 (값이 1s 면 지표가 없음)"
              description: &backup "kubectl -n data get jobs · logs job/<이름>. 손으로 돌리는 법은 infra/server/db-backup.md"

  # 주간 S3 백업(일요일 05:00)이 8일 넘게 성공하지 못함
  - name: 주간 S3 백업 8일 넘김
    interval: 1m
    input_series:
      - series: kube_cronjob_status_last_successful_time{namespace="data", cronjob="postgres-backup"}
        values: "0+60x11600"
      - series: kube_cronjob_status_last_successful_time{namespace="data", cronjob="postgres-backup-s3"}
        values: "0x11600"
    alert_rule_test:
      - eval_time: 7d23h59m
        alertname: NewlearnBackupMissing
      - eval_time: 8d10m
        alertname: NewlearnBackupMissing
      - eval_time: 8d11m
        alertname: NewlearnBackupMissing
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: critical
              namespace: data
              cronjob: postgres-backup-s3
            exp_annotations:
              summary: "DB 백업 postgres-backup-s3 의 마지막 성공이 8d 0h 11m 0s 전이다 (값이 1s 면 지표가 없음)"
              description: *backup

  # 뉴스 수집(Jira S15P31A102-154 · 156) — 값은 예약 · 성공 시각(초). 멈춘 동안은 울리지 않는다. 15분마다 기준(① · ② 30분, for 5분)
  - name: 수집 멈춘 동안은 안 울림
    interval: 1m
    input_series:
      - series: kube_cronjob_spec_suspend{namespace="app", cronjob="news-ingest"}
        values: "1x200"
      - series: kube_cronjob_status_last_schedule_time{namespace="app", cronjob="news-ingest"}
        values: "0x200"
      - series: kube_cronjob_status_last_successful_time{namespace="app", cronjob="news-ingest"}
        values: "-3600x200"
    alert_rule_test:
      - eval_time: 2h
        alertname: NewlearnIngestMissing

  # 성공 기록이 아예 없다(kube-state-metrics 는 그 줄을 안 낸다) — 처음부터 참이라 for 5m 뒤 울린다
  - name: 수집 성공 기록 없음
    interval: 1m
    input_series:
      - series: kube_cronjob_spec_suspend{namespace="app", cronjob="news-ingest"}
        values: "0x20"
      - series: kube_cronjob_status_last_schedule_time{namespace="app", cronjob="news-ingest"}
        values: "0x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: NewlearnIngestMissing
      - eval_time: 5m
        alertname: NewlearnIngestMissing
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: warning
              namespace: app
              cronjob: news-ingest
            exp_annotations:
              summary: "뉴스 수집 · 자동 투입 news-ingest — 마지막 성공 또는 예약 실행 뒤 0s 지났거나 성공 기록이 없다"
              description: &ingest "kubectl -n app get jobs · kubectl -n app logs job/<이름>. 결과 줄 release.skippedBy 가 wait · failing 이면 수집은 됐고 분석 줄이 막힌 것. 볼 것 · 멈추는 법은 infra/server/ingest.md 「경보가 오면」"

  # 15분마다 예약 · 1분 뒤 성공 — 조용하다
  - name: 수집 정상 운영
    interval: 1m
    input_series:
      - series: kube_cronjob_spec_suspend{namespace="app", cronjob="news-ingest"}
        values: "0x89"
      - series: kube_cronjob_status_last_schedule_time{namespace="app", cronjob="news-ingest"}
        values: "0x14 900x14 1800x14 2700x14 3600x14 4500x14"
      - series: kube_cronjob_status_last_successful_time{namespace="app", cronjob="news-ingest"}
        values: "60x14 960x14 1860x14 2760x14 3660x14 4560x14"
    alert_rule_test:
      - eval_time: 80m
        alertname: NewlearnIngestMissing

  # 예약은 계속 생기는데 1분 뒤 첫 성공 말고는 모두 실패 — 성공 뒤 30분(32분부터 참), for 5m
  - name: 수집 연속 실패
    interval: 1m
    input_series:
      - series: kube_cronjob_spec_suspend{namespace="app", cronjob="news-ingest"}
        values: "0x89"
      - series: kube_cronjob_status_last_schedule_time{namespace="app", cronjob="news-ingest"}
        values: "0x14 900x14 1800x14 2700x14 3600x14 4500x14"
      - series: kube_cronjob_status_last_successful_time{namespace="app", cronjob="news-ingest"}
        values: "60x89"
    alert_rule_test:
      - eval_time: 36m
        alertname: NewlearnIngestMissing
      - eval_time: 37m
        alertname: NewlearnIngestMissing
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: warning
              namespace: app
              cronjob: news-ingest
            exp_annotations:
              summary: "뉴스 수집 · 자동 투입 news-ingest — 마지막 성공 또는 예약 실행 뒤 36m 0s 지났거나 성공 기록이 없다"
              description: *ingest

  # 손 실행 성공만 이어지고 예약이 끊김 — 예약 뒤 30분(31분부터 참), for 5m
  - name: 수집 예약이 30분 넘게 없음
    interval: 1m
    input_series:
      - series: kube_cronjob_spec_suspend{namespace="app", cronjob="news-ingest"}
        values: "0x59"
      - series: kube_cronjob_status_last_schedule_time{namespace="app", cronjob="news-ingest"}
        values: "0x59"
      - series: kube_cronjob_status_last_successful_time{namespace="app", cronjob="news-ingest"}
        values: "60x19 1200x19 2400x19"
    alert_rule_test:
      - eval_time: 35m
        alertname: NewlearnIngestMissing
      - eval_time: 36m
        alertname: NewlearnIngestMissing
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: warning
              namespace: app
              cronjob: news-ingest
            exp_annotations:
              summary: "뉴스 수집 · 자동 투입 news-ingest — 마지막 성공 또는 예약 실행 뒤 36m 0s 지났거나 성공 기록이 없다"
              description: *ingest

  # 로그 수집(Alloy)이 Loki 로 못 보냈다고 센 줄 — Alloy 는 시작할 때 사유 다섯 줄을 0 으로 만들어 두므로 같은 Pod 의 첫 증가도 increase() 로 잡힌다 (Jira S15P31A102-192)
  - name: 로그 버림
    interval: 30s
    input_series:
      # 10분에 100줄 버림. 다른 사유는 계속 0
      - series: loki_write_dropped_entries_total{job="alloy", pod="alloy-a", reason="ingester_error"}
        values: "0x19 100x40"
      - series: loki_write_dropped_entries_total{job="alloy", pod="alloy-a", reason="rate_limited"}
        values: "0x60"
    alert_rule_test:
      - eval_time: 9m
        alertname: NewlearnLogsDropped
      # 버린 로그는 되돌릴 수 없어 기다리지 않는다(for 없음)
      - eval_time: 10m
        alertname: NewlearnLogsDropped
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: warning
              pod: alloy-a
              reason: ingester_error
            exp_annotations:
              summary: "로그 수집 alloy-a — Loki 로 못 보냈다고 센 로그가 10분 동안 100줄쯤 (사유 ingester_error)"
              description: &logs "infra/server/alerts.md 「로그 경보가 오면」"
      # 10분 창을 지나면 더 늘지 않아 풀림
      - eval_time: 25m
        alertname: NewlearnLogsDropped

  # 로그 수집 메모리(RSS) 85% 15분 — kube-state-metrics 상한 줄이 둘(Pod 가 바뀌는 동안)이어도 평가가 깨지지 않아야 한다
  # 다른 컨테이너(설정 다시 읽기 보조)는 상한에 가까워도 보지 않는다. 파일 캐시까지 센 working set 이 높아도 보지 않는다(2026-11-11 거짓 경보)
  - name: 로그 수집 메모리 85% 넘김
    interval: 30s
    input_series:
      # 0 ~ 9분 30초 128(50%), 10분부터 230(약 90%)
      - series: container_memory_rss{namespace="monitoring", pod="alloy-a", container="alloy", instance="node-a"}
        values: "128x19 230x60"
      - series: container_memory_working_set_bytes{namespace="monitoring", pod="alloy-b", container="alloy", instance="node-b"}
        values: "250x80"
      - series: container_memory_rss{namespace="monitoring", pod="alloy-b", container="alloy", instance="node-b"}
        values: "66x80"
      - series: kube_pod_container_resource_limits{namespace="monitoring", pod="alloy-b", container="alloy", resource="memory", unit="byte", instance="ksm-1"}
        values: "256x80"
      - series: kube_pod_container_resource_limits{namespace="monitoring", pod="alloy-a", container="alloy", resource="memory", unit="byte", instance="ksm-1"}
        values: "256x80"
      - series: kube_pod_container_resource_limits{namespace="monitoring", pod="alloy-a", container="alloy", resource="memory", unit="byte", instance="ksm-2"}
        values: "256x80"
      - series: container_memory_rss{namespace="monitoring", pod="alloy-a", container="config-reloader", instance="node-a"}
        values: "250x80"
      - series: kube_pod_container_resource_limits{namespace="monitoring", pod="alloy-a", container="config-reloader", resource="memory", unit="byte", instance="ksm-1"}
        values: "256x80"
    alert_rule_test:
      - eval_time: 9m
        alertname: NewlearnLogShipperMemoryHigh
      # 10분부터 참, for 15m 이 아직 안 참
      - eval_time: 24m
        alertname: NewlearnLogShipperMemoryHigh
      - eval_time: 26m
        alertname: NewlearnLogShipperMemoryHigh
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: warning
              namespace: monitoring
              pod: alloy-a
              container: alloy
            exp_annotations:
              summary: "로그 수집 alloy-a 프로그램 메모리(RSS)가 상한의 89.84%"
              description: *logs

  # 노드 둘 중 하나의 로그 수집 Pod 가 준비되지 않음 — kube-state-metrics 줄이 둘이어도 하나로 본다
  - name: 로그 수집 한 노드 멈춤
    interval: 30s
    input_series:
      - series: kube_daemonset_status_desired_number_scheduled{namespace="monitoring", daemonset="alloy", instance="ksm-1"}
        values: "2x80"
      - series: kube_daemonset_status_desired_number_scheduled{namespace="monitoring", daemonset="alloy", instance="ksm-2"}
        values: "2x80"
      # 10분부터 준비된 Pod 1
      - series: kube_daemonset_status_number_available{namespace="monitoring", daemonset="alloy", instance="ksm-1"}
        values: "2x19 1x60"
      - series: kube_daemonset_status_number_available{namespace="monitoring", daemonset="alloy", instance="ksm-2"}
        values: "2x19 1x60"
    alert_rule_test:
      - eval_time: 9m
        alertname: NewlearnLogShipperDown
      - eval_time: 19m
        alertname: NewlearnLogShipperDown
      - eval_time: 21m
        alertname: NewlearnLogShipperDown
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: warning
              namespace: monitoring
              daemonset: alloy
            exp_annotations:
              summary: &down "로그 수집 Alloy 가 일부 노드에서 멈췄거나 그 지표를 못 모은다 — 그 노드 로그가 Loki 에 안 쌓일 수 있다"
              description: *logs

  # 값을 바꿔 노드마다 하나씩 다시 뜨는 동안(1분)은 울리지 않는다
  - name: 로그 수집 차례로 다시 뜸
    interval: 30s
    input_series:
      - series: kube_daemonset_status_desired_number_scheduled{namespace="monitoring", daemonset="alloy"}
        values: "2x80"
      - series: kube_daemonset_status_number_available{namespace="monitoring", daemonset="alloy"}
        values: "2x19 1x1 2x2 1x1 2x55"
    alert_rule_test:
      - eval_time: 15m
        alertname: NewlearnLogShipperDown
      - eval_time: 30m
        alertname: NewlearnLogShipperDown

  # Pod 는 준비됐는데 지표 수집이 실패 — 버린 로그 경보를 믿을 수 없다
  - name: 로그 수집 지표 수집 실패
    interval: 30s
    input_series:
      - series: kube_daemonset_status_desired_number_scheduled{namespace="monitoring", daemonset="alloy"}
        values: "2x80"
      - series: kube_daemonset_status_number_available{namespace="monitoring", daemonset="alloy"}
        values: "2x80"
      - series: up{namespace="monitoring", container="alloy", pod="alloy-a", job="alloy"}
        values: "1x19 0x60"
      - series: up{namespace="monitoring", container="alloy", pod="alloy-b", job="alloy"}
        values: "1x80"
    alert_rule_test:
      - eval_time: 19m
        alertname: NewlearnLogShipperDown
      - eval_time: 21m
        alertname: NewlearnLogShipperDown
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: warning
              namespace: monitoring
              container: alloy
              pod: alloy-a
              job: alloy
            exp_annotations:
              summary: *down
              description: *logs

  # 재시작 경보는 monitoring 에서 로그 수집 · 창고(alloy · loki)만 본다 — Grafana 같은 나머지는 보지 않는다
  - name: 로그 수집 되풀이 재시작
    interval: 30s
    input_series:
      # 10분 · 10분 30초 · 11분에 다시 뜸(쌓인 수 1 · 2 · 3)
      - series: kube_pod_container_status_restarts_total{namespace="monitoring", pod="alloy-a", container="alloy"}
        values: "0x19 1 2 3x40"
      - series: kube_pod_container_status_restarts_total{namespace="monitoring", pod="kps-grafana-a", container="grafana"}
        values: "0x19 1 2 3x40"
    alert_rule_test:
      - eval_time: 9m
        alertname: NewlearnPodRestarting
      - eval_time: 12m
        alertname: NewlearnPodRestarting
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: warning
              namespace: monitoring
              pod: alloy-a
              container: alloy
            exp_annotations:
              summary: "monitoring/alloy-a 의 alloy 가 15분 안에 3번쯤 다시 떴다"
              description: "kubectl -n monitoring logs alloy-a -c alloy --previous 로 죽기 전 로그를 본다. 지나간 로그는 Grafana › Explore › Loki"

  # Pod 가 새로 떠 다시 보내기가 첫 수집(30초) 전에 끝나면, 첫 표본부터 값이 있어 increase() 는 0 이다
  # 2026-11-11 운영에서 그대로 겪었다 — 워커 Alloy 를 지운 뒤 15초 안에 123,167줄을 셌고 첫 수집 값이 이미 그 수였다 (Jira S15P31A102-192)
  - name: 새 Pod 가 첫 수집 전에 버림
    interval: 30s
    input_series:
      # 5분에 처음 나타날 때 이미 500
      - series: loki_write_dropped_entries_total{job="alloy", pod="alloy-new", reason="ingester_error"}
        values: "_x10 500x40"
      - series: loki_write_dropped_entries_total{job="alloy", pod="alloy-new", reason="rate_limited"}
        values: "_x10 0x40"
    alert_rule_test:
      - eval_time: 4m
        alertname: NewlearnLogsDropped
      - eval_time: 5m30s
        alertname: NewlearnLogsDropped
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: warning
              pod: alloy-new
              reason: ingester_error
            exp_annotations:
              summary: "로그 수집 alloy-new — Loki 로 못 보냈다고 센 로그가 10분 동안 500줄쯤 (사유 ingester_error)"
              description: *logs
      # 나타난 지 10분이 지나면 10분 전 값이 생기고 더 늘지 않아 풀림
      - eval_time: 16m
        alertname: NewlearnLogsDropped

  # 분석 작업(analysis_job, Jira S15P31A102-215) — 근거 지표는 postgres_exporter 의 사용자 정의 질의(infra/k8s/bootstrap/pg-exporter/queries.yaml)
  # ① 끝난 실패가 늘면 울리고 30분 뒤 풀린다. 처음 30분은 offset 쪽 기록이 없어 시험에서 비어 있다(실제로는 앞선 기록이 있다) — 그 뒤만 본다
  - name: 분석 작업 끝난 실패가 늚
    interval: 30s
    input_series:
      # 0 ~ 40분 4, 40분 30초부터 5 — EXTRACT 하나가 끝내 실패. 판정 단계는 그대로 0
      - series: newlearn_analysis_failed_terminal{stage="EXTRACT"}
        values: "4x80 5x80"
      - series: newlearn_analysis_failed_terminal{stage="MATCH_EVENT"}
        values: "0x160"
    alert_rule_test:
      - eval_time: 35m
        alertname: NewlearnAnalysisJobFailed
      # 늘자마자 울림(for 없음). 판정 단계는 안 울린다
      - eval_time: 41m
        alertname: NewlearnAnalysisJobFailed
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: warning
              stage: EXTRACT
            exp_annotations:
              summary: "분석 작업 EXTRACT 이 끝내 실패했다 — 30분 동안 1건"
              description: &analysis_failed "다시 걸리지 않는 실패다. 어느 기사 · 어떤 오류인지는 infra/server/alerts.md 「분석 작업 경보가 오면」"
      # 30분 뒤에는 offset 쪽도 5 라 풀림
      - eval_time: 71m
        alertname: NewlearnAnalysisJobFailed

  # exporter 수집이 한 번 실패하면 끊김 표시가 남고, 30분 뒤 offset 쪽이 한 평가 동안 빈다.
  # or vector(0) 을 쓰지 않아 그때 결과도 비어 울리지 않아야 한다 — 상한 경보는 여기서 거짓으로 울렸다 (리뷰 2026-11-15)
  - name: 분석 작업 실패 수 수집 한 번 끊김은 안 울림
    interval: 30s
    input_series:
      # 4 가 이어지다 40분 30초에 수집 한 번 실패, 41분부터 다시 4
      - series: newlearn_analysis_failed_terminal{stage="EXTRACT"}
        values: "4x80 stale 4x80"
    alert_rule_test:
      - eval_time: 40m30s
        alertname: NewlearnAnalysisJobFailed
      # 70분 30초에 offset 쪽(40분 30초)이 비는 순간
      - eval_time: 70m30s
        alertname: NewlearnAnalysisJobFailed
      - eval_time: 72m
        alertname: NewlearnAnalysisJobFailed

  # 누가 끝난 실패를 손으로 되살려 수가 줄면 새 실패가 아니다
  - name: 분석 작업 실패 수가 줄어듦은 안 울림
    interval: 30s
    input_series:
      - series: newlearn_analysis_failed_terminal{stage="EXTRACT"}
        values: "5x80 4x80"
    alert_rule_test:
      - eval_time: 41m
        alertname: NewlearnAnalysisJobFailed
      - eval_time: 60m
        alertname: NewlearnAnalysisJobFailed

  # ② 판정 줄이 40분 넘게 멈춤 — 5분 이어지면 울림
  - name: 판정 줄이 40분 넘게 멈춤
    interval: 30s
    input_series:
      # 0 ~ 10분 2,000초(33분 20초) — 아직 아님, 10분 30초부터 2,500초(41분 40초)
      - series: newlearn_analysis_line_oldest_inflight_seconds{stage="MATCH_EVENT"}
        values: "2000x20 2500x40"
      - series: newlearn_analysis_line_oldest_inflight_seconds{stage="ISSUE"}
        values: "0x60"
    alert_rule_test:
      - eval_time: 10m
        alertname: NewlearnAnalysisLineStuck
      # 10분 30초부터 참이지만 for 5m 이 아직
      - eval_time: 15m
        alertname: NewlearnAnalysisLineStuck
      - eval_time: 15m30s
        alertname: NewlearnAnalysisLineStuck
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: critical
              stage: MATCH_EVENT
            exp_annotations:
              summary: "MATCH_EVENT 줄이 41m 40s 째 멈췄다 — 새 기사가 사건 · 이슈에 안 붙는다"
              description: "infra/server/alerts.md 「분석 작업 경보가 오면」. AI 워커 플래그를 일부러 껐다면 silence 를 건다"

  # ③ 지표마다 따로 absent — 질의 하나만 깨지면 그 지표만 사라진다(2026-11-15 로컬 시험). 하나씩만 빠진 두 경우를 본다 (리뷰 2026-11-15)
  - name: 분석 작업 실패 수 지표만 사라짐
    interval: 30s
    input_series:
      - series: newlearn_analysis_line_oldest_inflight_seconds{stage="MATCH_EVENT"}
        values: "0x40"
    alert_rule_test:
      - eval_time: 9m30s
        alertname: NewlearnAnalysisMetricsMissing
      - eval_time: 10m30s
        alertname: NewlearnAnalysisMetricsMissing
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: warning
              stage: EXTRACT
            exp_annotations:
              summary: "분석 작업 지표 하나를 못 모은다(stage EXTRACT — EXTRACT 는 실패 수, MATCH_EVENT 는 줄 멈춤) — 위 두 경보를 믿을 수 없다"
              description: &analysis_missing "kubectl -n monitoring logs deploy/postgres-exporter 에서 queryNamespaceMappings 오류를 본다. 질의 · 권한은 infra/k8s/bootstrap/pg-exporter/"

  - name: 분석 작업 줄 멈춤 지표만 사라짐
    interval: 30s
    input_series:
      - series: newlearn_analysis_failed_terminal{stage="EXTRACT"}
        values: "4x40"
    alert_rule_test:
      - eval_time: 10m30s
        alertname: NewlearnAnalysisMetricsMissing
        exp_alerts:
          - exp_labels:
              notify: mattermost
              severity: warning
              stage: MATCH_EVENT
            exp_annotations:
              summary: "분석 작업 지표 하나를 못 모은다(stage MATCH_EVENT — EXTRACT 는 실패 수, MATCH_EVENT 는 줄 멈춤) — 위 두 경보를 믿을 수 없다"
              description: *analysis_missing

  - name: 분석 작업 지표가 둘 다 있으면 안 울림
    interval: 30s
    input_series:
      - series: newlearn_analysis_failed_terminal{stage="EXTRACT"}
        values: "4x40"
      - series: newlearn_analysis_line_oldest_inflight_seconds{stage="MATCH_EVENT"}
        values: "0x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: NewlearnAnalysisMetricsMissing
