# 굽기 러너 네임스페이스의 나가는 길 — 바깥 인터넷 · DNS · API 서버만 (Jira S15P31A102-106)
# 굽기 잡은 운영 노드(Lightsail)에서 팀 MR 의 Dockerfile · 의존성 설치를 돈다. 같은 노드의 postgres · redis · Argo CD 에 못 붙게 막는다
# 이름표가 아니라 네임스페이스 전체에 건다 — MR 이 CI 파일에서 이름표를 지워도 벗어나지 못한다(잡은 네임스페이스를 못 바꾼다)
# kube-apiserver 는 러너 매니저(같은 네임스페이스, 관리 서버)가 잡 Pod 를 만들고 붙는 데 쓴다. 잡 Pod 는 서비스 계정 토큰이 없다
# 쓰는 곳: infra/server/README.md 「굽기 러너」 — kubectl apply -f 로 (러너처럼 Argo CD 밖)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: build-egress
  namespace: gitlab-runner-build
spec:
  endpointSelector: {}
  egress:
    # lab.ssafy.com(소스 받기 · 산출물 올리기) · ghcr.io · docker.io · npm · PyPI · Gradle 저장소
    - toEntities:
        - world
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
