# grafana/alloy 차트 1.14.3 (Alloy v1.21.2) 값 — 서버마다 하나씩 Pod 로그를 읽어 Loki 로 보낸다 (Jira S15P31A102-128)
# 쓰는 곳: infra/server/logging.md. 왜 · 무엇을 모으나는 SSOT.md 6절 「모니터링」 · docs/plans/2026-10-28-loki.md
# 값의 뜻은 `helm show values grafana/alloy --version 1.14.3` 으로 확인했다 (2026-10-28)

# PodLogs 같은 자원 종류(CRD)는 쓰지 않는다 — 클러스터 전체에 새 종류를 만들지 않게
crds:
  create: false

# 권한은 「Pod 찾기」만 — 차트 기본값은 다른 기능(remote.kubernetes.secret 등)을 위해 Secret · ConfigMap 까지 읽는다 (helm template 로 확인, 2026-10-28)
# 차트 틀이 rules 와 clusterRules 를 그대로 이어 붙여서, 한쪽을 빈 목록([])으로 두면 YAML 이 깨진다 — 같은 규칙을 양쪽에 적는다(권한은 같다)
rbac:
  rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]
  clusterRules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]

alloy:
  # 읽은 위치(책갈피, <storagePath>/loki.source.file.pods/positions.yml)를 서버 디스크에 둔다 (Jira S15P31A102-192)
  #   차트 기본 /tmp/alloy 는 컨테이너 안이라 컨테이너가 다시 뜨면 사라진다. 그러면 노드 로그를 처음부터 다시 보내
  #   Loki 로 몰려간다(2026-11-11 워커에서 15초에 13만 6천 줄). 상한(초당 4MB)을 넘으면 새 로그가 늦어지거나 빠질 수 있고,
  #   11-11 측정에서는 상한 아래라 지연은 없었고 「버린 로그」 숫자만 크게 잡혔다. 경위는 infra/server/logging.md 「겪은 것」 · SSOT 10절
  #   서버 쪽 자리는 아래 controller.volumes.extra. 처음 바꿀 때는 infra/server/logging.md 3절대로 책갈피를 먼저 옮긴다
  storagePath: /var/lib/alloy
  mounts:
    # 서버의 Pod 로그 파일(/var/log/pods)을 읽는다. 차트가 읽기 전용으로 붙인다
    varlog: true
    # 설정 다시 읽기 보조 컨테이너에는 붙지 않는다(차트 설명)
    extra:
      - name: alloy-storage
        mountPath: /var/lib/alloy
  # Grafana 로 보내는 익명 사용 통계를 끈다
  enableReporting: false
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  configMap:
    content: |
      // 이 서버(노드)에 뜬 Pod 만 찾는다 — HOSTNAME 은 차트가 노드 이름으로 넣는다
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // CI 잡 로그는 모으지 않는다 — 검사 스크립트가 찍은 값이 남을 수 있고 GitLab 화면에 이미 있다 (사용자 결정 2026-10-28)
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "gitlab-runner.*"
          action        = "drop"
        }

        // 찾을 때 쓰는 라벨 — 적게 둔다(라벨 조합마다 따로 쌓이므로 Pod 이름까지만)
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        // 컨테이너 로그 파일 자리 — /var/log/pods/<네임스페이스>_<Pod>_<uid>/<컨테이너>/0.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        // containerd 가 붙인 머리(시각 · stdout/stderr · 조각 표시)를 풀어 원래 줄만 남긴다
        stage.cri {}

        // 스프링이 시작할 때 찍는 기본 비밀번호 줄은 버린다 — 쓸 수 없는 값이지만 Grafana 를 보는 모두에게 14일 남지 않게 (사용자 결정 2026-10-28)
        stage.drop {
          expression = ".*Using generated security password.*"
        }

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset
  # 서버 데이터 자리 관례(/var/lib/newlearn/<이름>, Loki PV 와 같다). 노드마다 따로라 hostPath — 없으면 만든다
  #   Alloy 는 root 로 돈다(/var/log/pods 를 읽으려면 필요, 2026-11-11 id 로 확인)라 만든 폴더에 쓸 수 있다
  volumes:
    extra:
      - name: alloy-storage
        hostPath:
          path: /var/lib/newlearn/alloy
          type: DirectoryOrCreate
  # 관리 서버(control-plane taint)에도 뜨게 — monitoring · kube-system 로그도 모은다
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# Prometheus 가 Alloy 자체 지표를 모은다 — 버린 로그 · 멈춤 경보(infra/k8s/alerts/rules.yaml)가 쓴다 (Jira S15P31A102-192)
# kps 가 모든 ServiceMonitor 를 읽는다(monitoring-values.yaml serviceMonitorSelectorNilUsesHelmValues). 수집 주기는 비워 전역 30초를 따른다
# 쓰는 지표만 남긴다 — Pod 하나가 약 400줄을 내지만(2026-11-11) 경보 · 확인에 쓰는 것은 아래 여섯. up 은 거르기와 상관없이 남는다
serviceMonitor:
  enabled: true
  metricRelabelings:
    - sourceLabels: [__name__]
      regex: "loki_write_dropped_entries_total|loki_write_sent_entries_total|loki_source_file_files_active_total|go_gc_gomemlimit_bytes|process_resident_memory_bytes|go_memstats_heap_inuse_bytes"
      action: keep
