# Prometheus 데이터용 정적 PV — 관리 서버 디스크의 폴더 하나 (Jira S15P31A102-95)
# monitoring-values.yaml 의 storageSpec 이 storageClassName · 라벨로 이 PV 를 고른다. 프로비저너 없이 손으로 만든 PV 다
# 폴더는 먼저 만들고 Prometheus 사용자(uid 1000 · gid 2000)에게 준다 — infra/server/README.md 「모니터링」
# Retain: PVC 를 지워도 데이터는 남는다. 지울 때는 PV 와 폴더를 손으로 지운다
#
# StorageClass 도 실제로 있어야 한다 — Prometheus Operator 는 없는 이름이면 「storage class … does not exist」로 멈춘다 (2026-10-20 겪음)
# no-provisioner = 디스크를 자동으로 만들지 않는 「이름표」 클래스. WaitForFirstConsumer = Pod 가 놓일 노드가 정해진 뒤 PV 를 묶는다(로컬 볼륨 권장)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: newlearn-local-manual
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-local
  labels:
    app.kubernetes.io/name: prometheus-local
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: newlearn-local-manual
  local:
    path: /var/lib/newlearn/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
