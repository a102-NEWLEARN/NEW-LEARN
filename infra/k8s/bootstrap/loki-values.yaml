# grafana/loki 차트 7.5.0 (앱 판 3.6.16 · 이미지 3.6.11 — infra/server/logging.md 「겪은 것」) 값 — 관리 서버(EC2)에 로그 창고 하나 (Jira S15P31A102-128)
# 쓰는 곳: infra/server/logging.md. 왜 · 무엇을 모으나는 SSOT.md 6절 「모니터링」 · docs/plans/2026-10-28-loki.md
# 값의 뜻은 `helm show values grafana/loki --version 7.5.0` 으로 확인했다 (2026-10-28)
#
# 하루 로그가 20MB 안팎(2026-10-28 두 서버 /var/log/pods 로 잼)이라 나눠 띄울 까닭이 없다 — 한 프로세스(SingleBinary)에 파일 저장
# 다른 모니터링처럼 관리 서버에 둔다: 워커가 죽어도 거기서 온 로그가 남게. CPU 예약은 작게 — CI 잡 자리(monitoring-values.yaml 머리)를 지킨다

deploymentMode: SingleBinary

loki:
  # 우리만 쓰는 창고라 테넌트(X-Scope-OrgID)를 나누지 않는다. 밖에는 열지 않고 Grafana 와 Alloy 만 클러스터 안에서 부른다
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  # 색인은 하루 단위 TSDB — Loki 3 의 권장 형식. 날짜는 처음 설치하는 날보다 앞이면 된다
  schemaConfig:
    configs:
      - from: "2026-10-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  # 14일 지난 로그는 compactor 가 지운다 (사용자 결정 2026-10-28 — 그때 Prometheus 15일과 비슷하게. Prometheus 는 2026-11-02 7일로 줄였다 — 로그는 작아 그대로)
  limits_config:
    retention_period: 336h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  # Grafana 로 보면 되니 Loki 자체 화면은 끈다. 사용 통계도 보내지 않는다
  ui:
    enabled: false
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  # 관리 서버 디스크의 정적 PV(loki-pv.yaml)에 묶는다. uninstall 해도 PVC 를 지우지 않는다 — 로그를 손으로 정리할 때까지 남긴다
  persistence:
    enabled: true
    whenDeleted: Retain
    whenScaled: Retain
    enableStatefulSetAutoDeletePVC: false
    storageClass: newlearn-local-manual
    size: 5Gi
    selector:
      matchLabels:
        app.kubernetes.io/name: loki-local

# 나눠 띄우는 구성(SimpleScalable)의 Pod 는 띄우지 않는다
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# 경보 규칙을 ConfigMap 에서 읽어 오는 보조 컨테이너(k8s-sidecar)를 끈다 — 로그로 경보를 보내지 않는다.
# 켜 두면 클러스터의 모든 ConfigMap · Secret 을 읽는 권한(ClusterRole)이 같이 붙는다 (helm template 로 확인, 2026-10-28)
sidecar:
  rules:
    enabled: false

# 차트가 기본으로 켜는 것들 — 이 규모에는 필요 없고 무겁다(캐시는 memcached 로 메모리를 GB 단위로 잡는다)
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
