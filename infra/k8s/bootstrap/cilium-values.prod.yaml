# 실제 서버(kubeadm — EC2 컨트롤 플레인 + Lightsail 워커)에서만 덮는 값. 공통 값은 cilium-values.yaml
# 쓰는 곳: infra/server/init-control-plane.sh. 노드 사이 설계는 SSOT.md 6절 「노드 사이 — 호스트 WireGuard」
# 값의 뜻은 Cilium 1.20.3 차트의 values.yaml 설명, 동작은 Cilium v1.20 소스로 확인했다 (2026-10-20). 서버에서는 아직 안 봤다

# kube-proxy 가 없어 Cilium 이 API 서버 주소를 직접 알아야 한다 — 컨트롤 플레인의 터널 주소. 포트는 공통 값(6443)
k8sServiceHost: 10.200.0.1

# wg0 의 MTU 와 같게 고정한다
# 차트 설명: 노드 인터페이스(ens5 · wg0)는 그대로 두고 cilium_host · cilium_vxlan · lxc_health 의 MTU 를 정한다
# Pod 쪽 MTU 는 이 값에서 VXLAN 머리 50바이트를 Cilium 이 스스로 뺀 1370 이 된다 (소스 pkg/mtu/mtu.go TunnelOverheadIPv4)
# 안 주면 고른 인터페이스 중 가장 작은 MTU 를 쓰는데, ens5(점보 9001)만 잡히면 Pod MTU 가 8951 이 되어 wg0(1420)에서 큰 패킷이 깨진다
MTU: 1420

# eBPF 프로그램을 붙일 인터페이스. 쉼표로 나누고 「+」는 앞부분이 같은 이름 전부다 (차트 설명)
#   ens+ · eth+  공인 쪽 — 인터넷에서 오는 80 · 443(hostPort)을 받는다. EC2 는 ens5, Lightsail 은 이름 미확인이라 둘 다 적는다. 없는 이름은 오류 없이 건너뛴다
#   wg0          노드 주소(InternalIP)가 있는 곳 — Cilium 은 고른 인터페이스 가운데 노드 주소가 있는 것을 노드 사이 길(direct routing device)로 잡는다
# 자동 감지도 둘 다 잡을 것으로 보이지만(소스 pkg/datapath/linux/devices_controller.go) 서버마다 다른 인터페이스가 끼지 않게 적어 둔다
devices: ens+,eth+,wg0
