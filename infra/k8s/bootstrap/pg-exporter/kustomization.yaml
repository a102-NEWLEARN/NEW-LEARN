# postgres_exporter v0.20.1 · 대시보드 「조회 성능」 · 분석 작업 질의 — 관리 서버(EC2) monitoring 네임스페이스 (Jira S15P31A102-189 · 215)
# 쓰는 곳: infra/server/perf/README.md 「exporter 올리기」. 왜 · 무엇을 보나는 SSOT.md 6절 「모니터링」 · docs/plans/2026-11-11-query-performance.md
#   · docs/plans/2026-11-15-analysis-job-alerts.md
# 까는 법: (backend 마이그레이션이 끝난 DB 에서) bash infra/k8s/bootstrap/pg-exporter/make-secret.sh → kubectl apply -k infra/k8s/bootstrap/pg-exporter
# DB 비밀번호는 여기 없다. make-secret.sh 가 서버에서 만든 Secret postgres-exporter(키 password)를 읽는다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - exporter.yaml
configMapGenerator:
  # Grafana 사이드카가 이름표 grafana_dashboard=1 이 붙은 ConfigMap 을 모든 네임스페이스에서 읽어 대시보드로 올린다
  # 이름은 고정한다 — 해시가 붙으면 바꿀 때마다 옛 ConfigMap 이 남아 같은 대시보드가 둘 뜬다
  - name: grafana-dashboard-query-perf
    files:
      - query-perf-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  # 분석 작업 질의(Jira S15P31A102-215) — 이쪽은 해시를 붙인다: 질의를 바꾸면 이름이 바뀌어 exporter Pod 가 새 질의로 다시 뜬다.
  # apply -k 는 옛 ConfigMap 을 지우지 않으니 남은 것은 손으로 지워도 된다
  - name: postgres-exporter-queries
    files:
      - queries.yaml
