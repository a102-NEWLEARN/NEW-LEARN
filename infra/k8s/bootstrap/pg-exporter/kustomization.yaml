# postgres_exporter v0.20.1 · 대시보드 「조회 성능」 — 관리 서버(EC2) monitoring 네임스페이스 (Jira S15P31A102-189)
# 쓰는 곳: infra/server/README.md 「모니터링」 7번. 왜 · 무엇을 보나는 SSOT.md 6절 「모니터링」 · docs/plans/2026-11-11-query-performance.md
# 까는 법: bash infra/k8s/bootstrap/pg-exporter/make-secret.sh → kubectl apply -k infra/k8s/bootstrap/pg-exporter
# DB 비밀번호는 여기 없다. make-secret.sh 가 서버에서 만든 Secret postgres-exporter(키 password)를 읽는다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - exporter.yaml
configMapGenerator:
  # Grafana 사이드카가 이름표 grafana_dashboard=1 이 붙은 ConfigMap 을 모든 네임스페이스에서 읽어 대시보드로 올린다
  # 이름은 고정한다 — 해시가 붙으면 바꿀 때마다 옛 ConfigMap 이 남아 같은 대시보드가 둘 뜬다
  - name: grafana-dashboard-query-perf
    files:
      - query-perf-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
