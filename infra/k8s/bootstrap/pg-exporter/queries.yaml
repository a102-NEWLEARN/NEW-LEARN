# 분석 작업(analysis_job)을 세는 사용자 정의 질의 — 경보 셋의 근거 (Jira S15P31A102-215)
# 지표 이름은 「최상위 키_열 이름」이다: newlearn_analysis_failed_terminal · newlearn_analysis_line_oldest_inflight_seconds
# 경보는 infra/k8s/alerts/rules.yaml 의 NewlearnAnalysis* 셋, 왜 이 길인가는 docs/plans/2026-11-15-analysis-job-alerts.md
#
# 이 기능(--extend.query-path)은 v0.20.1 에서 deprecated 다(README 「deprecated in favor of built-in collector functions」).
# 이미지를 digest 로 고정했고 서비스는 길어야 12월이다. 질의를 못 읽으면 지표가 사라져 NewlearnAnalysisMetricsMissing 이 운다
#
# DB 역할 newlearn_monitor 는 이 표의 여섯 칸만 읽는다(make-secret.sh 의 열 단위 grant) — 질의에 다른 칸을 쓰면 권한 오류로
# 그 지표만 사라진다. 그래서 count(*) · select * · order by id 를 쓰지 않는다(count(*) 는 left join 의 빈 줄도 1 로 센다)
#
# 두 질의 모두 values 목록에서 left join 해 단계마다 늘 한 줄씩 낸다. 조건은 on 안에 둔다 — where 로 옮기면 0 인 단계의 줄이
# 사라지고, 그 단계의 첫 실패가 새 시계열로 생겨 경보의 offset 쪽이 비어 놓친다
newlearn_analysis_failed:
  # 끝난 실패 = FAILED 이고 다시 걸 예정(retry_at)이 없다 (AnalysisJobQueueing.recordFailure 가 STOP 이면 retry_at 을 비운다)
  # BACKLOG_SKIPPED 는 사람이 밀린 EMBED 를 일부러 건너뛴 표시라 뺀다(infra/server/embed-backlog-skip.sql, Jira 207)
  query: |
    select s.stage, count(j.stage) as terminal
    from (values ('EXTRACT'), ('EMBED'), ('MATCH_EVENT'), ('ISSUE')) as s(stage)
    left join public.analysis_job j
      on j.stage = s.stage
     and j.status = 'FAILED'
     and j.retry_at is null
     and j.error_code is distinct from 'BACKLOG_SKIPPED'
    group by s.stage
  metrics:
    - stage:
        usage: "LABEL"
        description: "분석 단계 (EXTRACT · EMBED · MATCH_EVENT · ISSUE)"
    - terminal:
        usage: "GAUGE"
        description: "다시 걸지 않는 실패(끝난 실패)의 누적 수 — 행이 쌓이기만 해서 늘면 새 실패다"

newlearn_analysis_line:
  # 한 번에 하나씩 도는 판정(MATCH_EVENT) · 이슈(ISSUE) 줄에서 진행 중인 작업 중 가장 오래된 것의 나이(초)
  # 진행 중 정의의 원본은 backend AnalysisJobRepository 의 findMatchInFlight · findIssueInFlight 다 — 한쪽을 바꾸면 다른 쪽도 바꾼다
  #   MATCH_EVENT: QUEUED, 또는 FAILED 인데 다시 걸 예정(retry_at 있음)
  #   ISSUE: 후보(candidates)가 있는 QUEUED, 또는 FAILED + retry_at. 후보가 빈 QUEUED 는 차례를 기다리는 대기 작업이라 뺀다
  # QUEUED 는 queued_at 부터, FAILED + retry_at 은 retry_at(다시 걸 때)부터 잰다. 건강한 재시도는 1분 스케줄러가 곧 QUEUED 로
  # 돌리며 queued_at 을 새로 쓰므로, 40분을 넘는 것은 스케줄러가 못 돌릴 때뿐이다. 다시 걸 때가 아직 오지 않았으면 0 으로 자른다
  query: |
    select s.stage,
           coalesce(greatest(0, extract(epoch from now() - min(
             case when j.status = 'QUEUED' then j.queued_at else j.retry_at end))), 0) as oldest_inflight_seconds
    from (values ('MATCH_EVENT'), ('ISSUE')) as s(stage)
    left join public.analysis_job j
      on j.stage = s.stage
     and ((j.status = 'QUEUED' and (j.stage = 'MATCH_EVENT' or j.candidates is not null))
          or (j.status = 'FAILED' and j.retry_at is not null))
    group by s.stage
  metrics:
    - stage:
        usage: "LABEL"
        description: "한 번에 하나씩 도는 단계 (MATCH_EVENT · ISSUE)"
    - oldest_inflight_seconds:
        usage: "GAUGE"
        description: "진행 중인 작업 중 가장 오래 기다린 것의 나이(초). 진행 중이 없으면 0"
