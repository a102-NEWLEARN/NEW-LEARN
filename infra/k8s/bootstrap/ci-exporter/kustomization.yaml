# gitlab-ci-pipelines-exporter v0.6.0 · 대시보드 「CI 병목」 — 관리 서버(EC2) monitoring 네임스페이스 (Jira S15P31A102-98)
# 쓰는 곳: infra/server/README.md 「모니터링」 6번. 왜 · 무엇을 보나는 SSOT.md 6절 「모니터링」 · docs/plans/2026-10-21-ci-exporter.md
# 까는 법: kubectl apply -k infra/k8s/bootstrap/ci-exporter — kubectl 에 kustomize 가 들어 있다 (서버 kubectl 1.36.5 · kustomize 5.8.1)
# GitLab 읽기 토큰은 여기 없다. 사람이 서버에서 만든 Secret gitlab-ci-exporter(키 gitlab-token)를 읽는다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - exporter.yaml
configMapGenerator:
  # 설정을 바꾸면 ConfigMap 이름 끝의 해시가 바뀌어 exporter Pod 가 새 설정으로 다시 뜬다
  - name: gitlab-ci-exporter-config
    files:
      - config.yml
  # Grafana 사이드카가 이름표 grafana_dashboard=1 이 붙은 ConfigMap 을 모든 네임스페이스에서 읽어 대시보드로 올린다
  # 이름은 고정한다 — 해시가 붙으면 바꿀 때마다 옛 ConfigMap 이 남아 같은 대시보드가 둘 뜬다
  - name: grafana-dashboard-ci-bottleneck
    files:
      - ci-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
