# gitlab-ci-pipelines-exporter — GitLab API 의 파이프라인 · 잡 기록을 Prometheus 지표로 바꾼다 (Jira S15P31A102-98)
# 네임스페이스(monitoring)와 설정 ConfigMap 은 kustomization.yaml 이 붙인다
#
# 공식 Helm 차트(0.3.5)는 쓰지 않는다 — 앱이 v0.5.10 에 멈춰 있고 Bitnami Redis 를 기본으로 켠다.
# 노드 · 자원 · 보안 설정을 어차피 다 바꿔야 해서 직접 쓰는 편이 짧다 (2026-10-21)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-ci-exporter
  labels:
    app.kubernetes.io/name: gitlab-ci-exporter
spec:
  # 한 대만. 두 대면 같은 GitLab 을 두 번 읽고, 일을 나누려면 Redis 가 필요하다
  # 값은 exporter 메모리에만 있어서 Pod 가 다시 뜨면 처음부터 다시 모은다. 이미 긁은 Prometheus 데이터는 남는다
  replicas: 1
  # 옛 Pod 를 먼저 내린다 — 바꾸는 동안 두 대가 같이 GitLab 을 읽지 않게
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab-ci-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab-ci-exporter
    spec:
      # 노드가 컨트롤 플레인 하나뿐이다 — 모니터링 차트와 같이 그 노드를 고르고 taint 를 견딘다 (monitoring-values.yaml)
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # 쿠버네티스 API 를 부르지 않는다
      automountServiceAccountToken: false
      # 이미지가 nobody(65534)로 돈다 (그 판의 Dockerfile)
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # v0.6.0 (2026-01-14). 태그는 사람이 읽으라고 남기고 받는 것은 digest 로 고정한다 (Docker Hub, 2026-10-21 확인)
          image: docker.io/mvisonneau/gitlab-ci-pipelines-exporter:v0.6.0@sha256:6356a22f18f7ffae7eac32397ec0a73495a2f637c66f943debb43613c833ccbb
          args: ["run", "--config", "/etc/gcpe/config.yml"]
          env:
            - name: GCPE_GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitlab-ci-exporter
                  key: gitlab-token
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 30
          # GitLab 헬스 검사를 꺼서(config.yml) exporter 의 웹 서버가 뜨면 Ready 다
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          # 관리 서버 CPU 예약이 이미 1190m(2 vCPU) — CI 잡 자리(550m)를 남기려고 작게
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/gcpe
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gitlab-ci-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-ci-exporter
  labels:
    app.kubernetes.io/name: gitlab-ci-exporter
spec:
  selector:
    app.kubernetes.io/name: gitlab-ci-exporter
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Prometheus(kps)는 모든 네임스페이스의 ServiceMonitor 를 읽는다 (monitoring-values.yaml 의 serviceMonitorSelectorNilUsesHelmValues)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitlab-ci-exporter
  labels:
    app.kubernetes.io/name: gitlab-ci-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab-ci-exporter
  endpoints:
    - port: http
      interval: 30s
      # 지표는 GitLab 의 잡 이야기라 exporter Pod 이름 · 주소가 필요 없다. 남겨 두면 Pod 가 다시 뜰 때마다
      # 같은 잡이 이름표만 다른 시계열로 하나 더 생겨 대시보드에서 두 번 센다 (2026-10-21 겪음)
      metricRelabelings:
        - action: labeldrop
          regex: pod|instance
