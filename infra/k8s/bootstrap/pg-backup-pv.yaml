# PostgreSQL 백업(pg_dump)용 정적 PV — 관리 서버 디스크의 폴더 하나 (Jira S15P31A102-109)
# DB 는 워커 디스크에 있다. 백업은 다른 서버(관리 서버)에 둬서 워커를 잃어도 남게 한다 (SSOT 6절 「저장소·백업」)
# services/data/postgres-backup.yaml 의 PVC 가 라벨로 이 PV 를 고르고, CronJob 이 관리 서버에 떠서 여기에 쓴다
# StorageClass newlearn-local-manual 은 prometheus-pv.yaml 에 있다 — 그 파일을 먼저 apply 한다
# 폴더는 먼저 만들고 postgres 이미지 사용자(uid 999 · gid 999)에게만 준다(0700) — 백업에 회원 정보가 들어 있다.
# 순서는 infra/server/README.md 「DB 백업」. Argo CD 밖에서 kubectl apply 로 (러너 · 모니터링 PV 와 같다)
# Retain: PVC 를 지워도 백업 파일은 남는다. 지울 때는 PV 와 폴더를 손으로 지운다
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pg-backup-local
  labels:
    app.kubernetes.io/name: pg-backup-local
spec:
  # 로컬 볼륨은 크기를 강제하지 않는다. 디스크 계획용 표시값이다 (2026-10-25 DB 8.5MB, 덤프 7일치)
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: newlearn-local-manual
  local:
    path: /var/lib/newlearn/pg-backup
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
