# Sealed Secrets 컨트롤러 — 저장소에는 공개키로 잠근 SealedSecret 만 두고, 이 컨트롤러가 개인키로 풀어 Secret 을 만든다 (SSOT 6절 「Secret」)
# 개인키를 잃으면 저장소의 SealedSecret 을 못 푼다 — 백업 · 복구는 infra/server/README.md 「Sealed Secrets 키」
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    # 다른 앱의 SealedSecret 보다 먼저 떠야 한다
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0 # 컨트롤러 v0.40.0. 서버의 kubeseal 도 같은 판 (infra/server/bootstrap-argocd.sh)
    helm:
      valuesObject:
        # Argo CD 는 앱 이름(sealed-secrets)을 릴리스 이름으로 써서 Service 이름이 kubeseal 기본값과 달라진다 — 기본값에 맞춘다
        fullnameOverride: sealed-secrets-controller
        # 기본은 30일마다 새 키를 더한다. 그러면 첫날 백업에 없는 키가 생긴다 — 키는 하나로 둔다
        keyrenewperiod: "0"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    # kubeseal 은 --controller-namespace sealed-secrets 로 부른다
    # 네임스페이스는 Git 에 두지 않고 CreateNamespace 로만 만든다 — 앱을 지울 때 개인키 Secret 까지 지워지지 않게
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
