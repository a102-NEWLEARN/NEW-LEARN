# Let's Encrypt 발급자 둘 — staging 으로 먼저 발급을 확인하고 prod 로 바꾼다 (prod 는 같은 이름 주당 5번 한도가 있다)
# 소유 확인(HTTP-01)은 Gateway public 의 http 리스너에 cert-manager 가 경로 하나(/.well-known/acme-challenge/<토큰>)를 잠깐 붙여서 푼다
# 연락 메일은 넣지 않는다 — Let's Encrypt 는 만료 메일을 더 보내지 않고, 만료는 Prometheus 지표로 본다
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: public
                namespace: envoy-gateway-system
                kind: Gateway
                sectionName: http
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: public
                namespace: envoy-gateway-system
                kind: Gateway
                sectionName: http
