# Envoy 를 워커 노드의 80 에 직접 연다 (hostPort) — 클라우드 로드밸런서가 없어서다 (SSOT 6절)
# Envoy Gateway 는 권한 없이 뜨려고 80 리스너를 컨테이너 10080 으로 옮겨 연다(포트 이동).
# 그 컨테이너 포트에 hostPort 80 을 붙인다. Cilium kube-proxy 대체가 hostPort 를 처리한다
# 443 리스너도 같은 방식으로 컨테이너 10443 → hostPort 443 (Jira S15P31A102-93)
#
# 교체 전략: 옛 Pod 를 먼저 내리고 새 Pod 를 띄운다 (maxSurge 0 · maxUnavailable 1)
# 워커가 1대라 80 을 잡은 Pod 가 둘일 수 없다. 기본값(먼저 띄우기)이면 새 Pod 가 Pending 에 멈춘다 (kind 리허설로 확인)
# 그래서 Envoy 를 바꿀 때(Envoy Gateway 업그레이드 · 이 설정 변경)는 잠깐 끊긴다. 앱 배포는 Envoy 를 재시작하지 않는다
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: node-ports
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # 밖에서 들어오는 길은 hostPort 다. Service 는 클러스터 안에서만 쓴다
      envoyService:
        type: ClusterIP
      envoyDeployment:
        replicas: 1
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: envoy
                      ports:
                        - containerPort: 10080
                          hostPort: 80
                          protocol: TCP
                        - containerPort: 10443
                          hostPort: 443
                          protocol: TCP
