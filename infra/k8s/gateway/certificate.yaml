# newlearn.io.kr · www 인증서 — Secret newlearn-tls 로 나오고 Gateway 의 https 리스너가 읽는다
# cert-manager 가 만료 30일 전에 다시 받는다(90일짜리라 60일마다). 갱신 확인법은 SSOT 6절 「도메인 · HTTPS」
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: newlearn
  namespace: envoy-gateway-system
spec:
  secretName: newlearn-tls
  dnsNames:
    - newlearn.io.kr
    - www.newlearn.io.kr
  issuerRef:
    kind: ClusterIssuer
    # staging 으로 발급 · 넘기기를 확인한 뒤 바꿨다 (2026-10-22)
    name: letsencrypt-prod
  privateKey:
    algorithm: ECDSA
    size: 256
    # 갱신 때마다 새 키를 만든다
    rotationPolicy: Always
