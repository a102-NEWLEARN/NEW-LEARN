# http 로 들어온 newlearn.io.kr 은 https 로, www 는 https://newlearn.io.kr 로 넘긴다 (301)
# 인증서 소유 확인 경로(/.well-known/acme-challenge/<토큰>)는 cert-manager 가 Exact 경로로 붙여서 이 넘기기보다 먼저 맞는다
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: to-https
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: public
      sectionName: http
  hostnames:
    - newlearn.io.kr
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www-to-apex
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: public
      sectionName: http
    - name: public
      sectionName: https
  hostnames:
    - www.newlearn.io.kr
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: newlearn.io.kr
            statusCode: 301
