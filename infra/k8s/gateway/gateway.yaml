apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: node-ports
    namespace: envoy-gateway-system
---
# 모든 서비스가 같이 쓰는 입구 하나. 앱은 자기 네임스페이스에서 HTTPRoute 로 붙는다
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    # 80 에는 http → https 넘기기와 인증서 소유 확인(HTTP-01)만 붙는다 (redirects.yaml)
    # 둘 다 envoy-gateway-system 에 있다 — cert-manager 는 소유 확인 라우트를 Certificate 가 있는 이 네임스페이스에 만든다
    # 이 목록에서 빠지면 인증서 갱신이 소리 없이 실패한다 (2026-10-22 설계 검토)
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [envoy-gateway-system]
    # 앱 · 관리 화면 라우트는 모두 sectionName: https 로 여기에만 붙는다 — http 에도 붙으면 넘기기보다 긴 경로가 이겨 평문으로 열린다
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        # cert-manager 가 만드는 Secret (certificate.yaml)
        certificateRefs:
          - name: newlearn-tls
      # 붙을 수 있는 네임스페이스 — www 넘기기(envoy-gateway-system) · 관리 화면(argocd · monitoring) · 서비스(app)
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [envoy-gateway-system, argocd, monitoring, app]
