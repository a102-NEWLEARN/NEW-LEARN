apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: node-ports
    namespace: envoy-gateway-system
---
# 모든 서비스가 같이 쓰는 입구 하나. 앱은 자기 네임스페이스에서 HTTPRoute 로 붙는다
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # 지금은 어느 네임스페이스든 붙을 수 있다. 앱 네임스페이스가 정해지면 Selector 로 좁힌다
      allowedRoutes:
        namespaces:
          from: All
