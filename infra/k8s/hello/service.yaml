apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  selector:
    app: hello
  ports:
    - name: http
      port: 80
      targetPort: http
---
# SSAFY 도메인의 80 — 입구가 사는지 바로 보는 시험 주소. newlearn.io.kr 의 80 은 https 로 넘긴다(redirects.yaml)
# 이름을 안 적으면 넘기기 라우트와 조건이 같아져 먼저 만든 이 라우트가 이긴다 — 그래서 이름에 묶는다
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - k15a102.p.ssafy.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hello
          port: 80
---
# https://newlearn.io.kr/ 자리 — 화면(frontend)을 올리기 전까지 인증서 · 443 이 사는지 보는 임시 응답. 서비스 첫 배포 때 hello 앱째 지운다
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-https
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - newlearn.io.kr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hello
          port: 80
