# 다른 Pod 에서 Grafana Pod 로 들어오는 길 — 공개 Gateway 의 Envoy 와 같은 네임스페이스 Prometheus 수집만 (Jira S15P31A102-119)
# Grafana 프록시 로그인은 X-WEBAUTH-USER 머리에 든 이름으로 바로 들여보낸다(bootstrap/monitoring-values.yaml 의 auth.proxy)
# 손님이 보낸 머리는 Envoy 가 맨 앞에서 지우지만(gateway/client-traffic.yaml) Envoy 를 거치지 않고 다른 Pod 에서 오는 길은 이 정책이 막는다
# 관리 화면을 닫을 때도 이 파일은 남긴다 — auth.proxy 가 켜져 있는 동안 필요하다(infra/server/README.md 「관리 화면만 닫기」)
# 그대로 남는 길:
#   - 관리 서버(Grafana 가 뜬 노드) 호스트에서 오는 것 — Cilium 은 로컬 호스트 통신을 기본으로 허용한다
#     kubelet 상태 확인, 호스트 네트워크 Pod(Cilium · 컨트롤 플레인 · node-exporter), API 서버 서비스 프록시,
#     관리자 SSH 터널(infra/server/README.md 「모니터링」 4. 열기 — Service 주소로 바로)
#     https://docs.cilium.io/en/v1.20/security/policy/layer3/ 「Entities Based」 host
#   - Grafana 사이드카(대시보드 · 데이터 소스 읽기) — 같은 Pod 의 localhost
#   - 관리자 kubectl port-forward — Pod 안 localhost 로 들어가는 길이라 정책 밖으로 본다. 반영 뒤 로그인 화면으로 확인한다
# 네임스페이스 이름표가 없는 규칙은 이 정책의 네임스페이스(monitoring)로 한정된다
#   https://docs.cilium.io/en/v1.20/security/policy/kubernetes/ 「Namespaces」
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-ingress
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    # /grafana 라우트(grafana.yaml)를 지난 요청 — Envoy 는 워커에, Grafana 는 관리 서버에 있어 노드를 건넌다
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-name: public
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Prometheus 가 /grafana/metrics 를 긁는다(monitoring-values.yaml 의 serviceMonitor)
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
