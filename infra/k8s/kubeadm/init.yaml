# kubeadm init 설정 — 컨트롤 플레인(EC2)에서 infra/server/init-control-plane.sh 가 쓴다
# 노드 주소는 WireGuard 터널 주소 10.200.0.1 이다. 이 주소가 API 서버 인증서에 들어가 나중에 바꾸기 어렵다 (SSOT.md 6절 「노드 사이 — 호스트 WireGuard」)
# 형식: https://v1-36.docs.kubernetes.io/docs/reference/config-api/kubeadm-config.v1beta4/
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  # etcd 도 이 주소에서 기다리므로 init 전에 wg0 에 이 주소가 있어야 한다 (infra/server/wg-up.sh)
  advertiseAddress: 10.200.0.1
  bindPort: 6443
nodeRegistration:
  criSocket: unix:///var/run/containerd/containerd.sock
  kubeletExtraArgs:
    # kubelet 이 이 주소를 노드 InternalIP 로 올린다. Cilium 은 노드 사이 VXLAN 을 이 주소로 보낸다
    - name: node-ip
      value: 10.200.0.1
  # taints 를 적지 않는다 — 비워 두면 컨트롤 플레인 taint 가 붙어 서비스 Pod 가 워커에만 뜬다
# kube-proxy 를 깔지 않는다. Cilium 이 대신한다 (k8s/bootstrap/cilium-values.yaml 의 kubeProxyReplacement)
skipPhases:
  - addon/kube-proxy
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
# 버전은 여기 한 곳에만 적는다. infra/server/common.sh 가 이 값을 읽어 kubeadm · kubelet · kubectl 패키지를 같은 판으로 고정한다
kubernetesVersion: v1.36.5
controlPlaneEndpoint: 10.200.0.1:6443
networking:
  # Cilium 이 노드마다 받은 Pod 주소 범위를 쓰는 모드(ipam.mode: kubernetes)라 꼭 준다. 겹치지 않는 까닭은 SSOT.md 6절
  podSubnet: 10.244.0.0/16
apiServer:
  certSANs:
    - 10.200.0.1
    # 관리자 PC 에서 SSH 터널(ssh -L 6443:10.200.0.1:6443)로 127.0.0.1:6443 에 붙어 kubectl 을 쓴다
    - 127.0.0.1
