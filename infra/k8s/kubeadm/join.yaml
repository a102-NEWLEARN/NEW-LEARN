# kubeadm join 설정 — 워커(Lightsail)에서 infra/server/join-worker.sh 가 쓴다
# 토큰 · CA 해시 자리(__TOKEN__ · __CA_CERT_HASH__)는 비워 두고, 스크립트가 컨트롤 플레인에서 받은 값으로 채운 사본을 만든다
# 형식: https://v1-36.docs.kubernetes.io/docs/reference/config-api/kubeadm-config.v1beta4/
apiVersion: kubeadm.k8s.io/v1beta4
kind: JoinConfiguration
discovery:
  bootstrapToken:
    # 컨트롤 플레인 API 서버도 WireGuard 터널 안에서만 닿는다
    apiServerEndpoint: 10.200.0.1:6443
    token: __TOKEN__
    caCertHashes:
      - __CA_CERT_HASH__
nodeRegistration:
  criSocket: unix:///var/run/containerd/containerd.sock
  kubeletExtraArgs:
    # 노드 InternalIP 를 터널 주소로 둔다 (init.yaml 의 컨트롤 플레인과 같은 까닭)
    - name: node-ip
      value: 10.200.0.2
