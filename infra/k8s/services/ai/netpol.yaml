# AI 워커로 들어오는 길 — 다른 Pod 는 아무도 못 들어온다 (Jira S15P31A102-121)
# 워커는 큐(Redis)에서 일을 받고 결과를 W1 으로 보낸다 — 워커를 부르는 Pod 가 없다(backend 에 AI 주소 설정 없음)
# 빈 규칙 `- {}` 는 이 Pod 를 들어오는 길 기본 거부로 두고 아무것도 허용하지 않는다
#   https://docs.cilium.io/en/v1.20/security/policy/layer3/ 「Ingress/Egress Default Deny」
# 그대로 남는 길: 워커 노드 호스트에서 오는 것(kubelet 상태 확인 /health · 호스트 네트워크 Pod) — Cilium 은 로컬 호스트 통신을 기본으로 허용한다
# 주의: 쿠버네티스 기본 NetworkPolicy 에서는 같은 `- {}` 가 「모두 허용」이다 — 이 파일은 CiliumNetworkPolicy 라 뜻이 반대다
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ai-ingress
spec:
  endpointSelector:
    matchLabels:
      app: ai
  ingress:
    - {}
