# AI 워커로 들어오는 길 — 뉴스 수집 배치의 상태 확인(/health)만 (Jira S15P31A102-121 · 156)
# 워커는 큐(Redis)에서 일을 받고 결과를 W1 으로 보낸다 — 일을 맡기려고 워커를 부르는 Pod 는 없다(backend 에 AI 주소 설정 없음)
# 수집 배치가 자동 투입 전에 회차마다 GET /health 를 본다 — BLOCKED · Redis DOWN(503)이면 그 회차는 B1 을 걸지 않는다
#   (2026-11-10 AI 팀장 기준, 계획 docs/plans/2026-11-10-ingest-15min-auto-b1.md). 수집은 app 네임스페이스의 CronJob(ingest/news-ingest.yaml)이다
#   8000 에서 열리는 것은 /health 와 FastAPI 기본 문서(/docs · /redoc · /openapi.json, ai/app/main.py) — 모두 읽기다
# 그대로 남는 길: 워커 노드 호스트에서 오는 것(kubelet 상태 확인 /health · 호스트 네트워크 Pod) — Cilium 은 로컬 호스트 통신을 기본으로 허용한다
# 2026-11-10 까지는 빈 규칙 `- {}` 로 아무것도 허용하지 않았다(들어오는 길 기본 거부) — 아래 규칙을 지울 때 그 줄로 되돌린다
#   https://docs.cilium.io/en/v1.20/security/policy/layer3/ 「Ingress/Egress Default Deny」
# 주의: 쿠버네티스 기본 NetworkPolicy 에서는 같은 `- {}` 가 「모두 허용」이다 — 이 파일은 CiliumNetworkPolicy 라 뜻이 반대다
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ai-ingress
spec:
  endpointSelector:
    matchLabels:
      app: ai
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: app
            app: news-ingest
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
