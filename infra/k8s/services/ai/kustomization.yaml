apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 네임스페이스 · 이름은 바꾸지 않는다 — SealedSecret 은 이름 · 네임스페이스(ai)에 묶여 봉인돼 있다
resources:
  - ai.yaml
  - model-cache.yaml
  - netpol.yaml
  - sealed-ghcr-pull.yaml
  # GMS 키(팀 공용) — Secret gms-api. ai.yaml 이 GMS_API_KEY 로 읽는다(실제 모드, infra/server/ai-worker.md)
  - sealed-gms-api.yaml
  - sealed-internal-api.yaml
# 배포 태그 — dev 에서 구운 커밋 짧은 SHA 8자. CI 태그 MR 잡이 이 블록의 newTag 만 바꾼다
# 태그는 따옴표로 감싼다 — 숫자로만 된 번호(19187037)를 YAML 이 숫자로 읽으면 kustomize 가 실패한다 (Jira S15P31A102-108)
images:
  - name: ghcr.io/kimzoo5676-del/newlearn-ai
    newTag: "09cee626"
