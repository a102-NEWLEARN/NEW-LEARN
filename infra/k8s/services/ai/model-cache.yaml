# 임베딩 모델(BGE-m3-ko, 판 하나 약 2.3GB)을 한 번 받아 두는 자리 — 받는 일은 ai.yaml 의 init 컨테이너 model 이 한다
# 이미지에 굽지 않는 까닭은 docs/plans/2026-10-26-ai-real-mode-infra.md 「모델 자리 — 세 안」
# 다시 받으면 되는 캐시라 Argo CD 가 지우게 둔다. 지워도 PV 와 워커 폴더는 남는다(StorageClass 가 Retain)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-model-cache
spec:
  storageClassName: newlearn-local
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # local-path 는 크기를 막지 않는다 — 표시일 뿐이다. 판을 바꾸면 옛 판을 지울 때까지 한 벌씩 는다
      storage: 10Gi
