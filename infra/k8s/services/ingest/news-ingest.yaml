# 뉴스 수집 배치 — NewsData 기사 → B2 기사 적재 → 자동 투입 B1 (Jira S15P31A102-154 · 156)
# 스크립트는 옆의 news_ingest.py(Python 표준 라이브러리만) — kustomization.yaml 의 configMapGenerator 가 ConfigMap 으로 얹는다(이미지를 굽지 않는다)
# 15분마다 최근 30분 기사를 넣고, 같은 회차에서 몫만큼 B1 을 자동으로 건다(auto, 2026-11-13 10:00 수집 뒤부터 — 앞서 매일 10시 전날치 넣기만).
# 몫 공식 · 쉬는 기준은 AI 팀장 2026-11-10, 계획 docs/plans/2026-11-10-ingest-15min-auto-b1.md (Jira 156). env 의 뜻 · 값은 infra/server/ingest.md 「설정」
# 손 실행(지난 날짜 · archive) · 로그 읽기 · 15분 모드 · 급히 멈추기도 infra/server/ingest.md
apiVersion: batch/v1
kind: CronJob
metadata:
  name: news-ingest
spec:
  # 2026-11-04 09:17 조건 없이 하루 약 1만 8천 건이라 멈췄다가, 팀장이 준 조건(INGEST_QUERY)으로 다시 켬 — 첫 실행 11-05 10:00(11/4 분)
  suspend: false
  # 시각을 바꾸면 infra/k8s/alerts/rules.yaml 의 NewlearnIngestMissing(30분 기준)도 같이 고친다
  schedule: "*/15 * * * *"
  timeZone: Asia/Seoul
  # 앞 실행이 안 끝났으면 겹쳐 돌지 않는다
  concurrencyPolicy: Forbid
  # 그 시각에 못 돌았으면 5분 안에는 늦게라도 돈다 — 더 늦으면 다음 실행이 같은 창을 받는다
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 다시 시도하지 않는다 — 다음 실행이 15분 뒤 겹치는 창을 다시 받는다. 종료 코드 뜻은 infra/server/ingest.md 「로그 읽기」
      backoffLimit: 0
      # 종료 2 는 다시 해도 같다(설정 · 출입증 401 · 403 · 요청 · 기사 상한) — 다시 시도하지 않고 실패로 끝낸다(크레딧을 안 쓰게)
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              containerName: ingest
              operator: In
              values: [2]
      # 다음 실행과 겹치지 않게 14분. 손 실행은 올려 띄운다(ingest.md). 요청마다 20초 상한은 스크립트에.
      # 넘기면 다시 돌지 않고 실패한다. 경보 ①(30분)은 이 값보다 길어야 한다
      activeDeadlineSeconds: 840
      template:
        metadata:
          # app/netpol.yaml 의 backend-ingress 가 이 이름표만 8080 으로 들인다. DB · Redis 에는 직접 안 붙는다
          labels:
            app: news-ingest
        spec:
          restartPolicy: Never
          # 쿠버네티스 API 를 부르지 않는다
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ingest
              # CI 태그 MR 잡(.gitlab-ci.yml 의 w5:deploy-mr)과 같은 이미지 — 올릴 때 두 곳을 같이. PYTHON_VERSION 3.14.8 (2026-11-03 레지스트리에서 확인)
              image: python:3.14.8-slim-trixie@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
              # -I 는 env · 현재 폴더의 모듈을 안 읽고, -B 는 .pyc 를 안 쓰고(읽기 전용 파일 시스템), -u 는 로그를 바로 내보낸다(시간 상한에 잘려도 남게)
              command: ["python", "-I", "-B", "-u", "/opt/ingest/news_ingest.py"]
              env:
                # auto = B2 로 넣은 뒤 회차 끝에 B3 · AI 워커 /health 를 보고 몫만큼 B1. 손 실행은 INGEST_MODE=load-only 로 덮는다(ingest.md)
                - name: INGEST_MODE
                  value: auto
                # 자동 투입 — 몫 = min(PER_RUN, PER_DAY − 오늘 건 수, CAPACITY − EXTRACT 대기). 가장 오래 기다린 EXTRACT 가 MAX_WAIT 분이면 쉼 · 경보.
                # FROM 은 덤프 마감 다음 날(후보 발행 KST 날짜 시작). CAPACITY 60 은 처음 값 — 첫 24 ~ 48시간 실측 뒤 AI 팀장과 정한다(AI 팀장 2026-11-10)
                - name: INGEST_RELEASE_FROM
                  value: "2026-11-12"
                - name: INGEST_RELEASE_PER_RUN
                  value: "50"
                - name: INGEST_RELEASE_PER_DAY
                  value: "5000"
                - name: INGEST_RELEASE_CAPACITY
                  value: "60"
                - name: INGEST_RELEASE_MAX_WAIT_MINUTES
                  value: "30"
                # BLOCKED · Redis DOWN(503) · 준비된 Pod 없음이면 그 회차는 쉰다 — ai/netpol.yaml 이 이 Pod 의 8000 만 들인다. off 면 보지 않는다
                - name: AI_HEALTH_URL
                  value: http://ai.ai.svc:8000/health
                # 15분마다 30분 창 — 앞 실행과 15분 겹쳐 한 번 실패해도 다음 실행이 받는다(2026-11-03 AI 팀장 제안)
                - name: INGEST_SOURCE
                  value: latest
                - name: INGEST_TIMEFRAME
                  value: 30m
                # 고르는 조건 — 팀원이 10/29 ~ 11/3 을 받은 쿼리와 같다(팀장 2026-11-04). 받는 키는 news_ingest.py 의 QUERY_KEYS.
                # 이 조건으로 10/21 ~ 28 은 평일 11,400 ~ 15,400건 · 주말 3,400 ~ 5,800건(팀장). 창 안의 기사를 끝까지 받는다.
                # sort=pubdateasc — 오래된 순. 날짜 범위(INGEST_DAYS)가 없으면 범위를 지나 멈추는 일도 없다 — 손 실행으로 날짜를 줄 때만 쓰인다
                - name: INGEST_QUERY
                  value: country=kr&language=ko&removeduplicate=1&excludecategory=sports,entertainment,lifestyle,food,tourism&sort=pubdateasc
                # 한 번 실행의 NewsData 요청(= 크레딧) · B2 로 보낼 기사 상한 — 평일 30분 창 최대 약 15요청 · 614건(2026-11-05 어림)의 2.5배쯤.
                # 다음 쪽이 남았는데 닿으면 받은 데까지 넣고 종료 2. 손 실행은 올려 띄운다(ingest.md)
                - name: INGEST_MAX_REQUESTS
                  value: "40"
                - name: INGEST_MAX_ARTICLES
                  value: "2000"
                - name: BACKEND_URL
                  value: http://backend.app.svc:8080
                # Secret 이 없으면 값이 비고, 스크립트가 까닭을 찍고 종료 2 — Pod 가 설정 오류로 멈춰 서 있지 않게 optional
                - name: NEWSDATA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: newsdata-api
                      key: NEWSDATA_API_KEY
                      optional: true
                # 직원용 문 출입증 중 배치 키 하나만 — 같은 Secret 의 워커 키는 이 Pod 로 오지 않는다(B2 · B3 · B1)
                - name: INTERNAL_BATCH_KEY
                  valueFrom:
                    secretKeyRef:
                      name: internal-api
                      key: INTERNAL_BATCH_KEY
                      optional: true
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                # 기사는 거른 자리에서 B2 요청 모양만 남긴다 — 하루 1만 건 · archive 한 구간(UTC 이틀) 약 1만 4천 건이 들어가게
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /opt/ingest
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: news-ingest
