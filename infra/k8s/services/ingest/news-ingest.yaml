# 뉴스 수집 배치 — NewsData 기사 → B2 기사 적재 (Jira S15P31A102-154 · 156, 계획 docs/plans/2026-11-04-ingest-load-only-data-load.md)
# 스크립트는 옆의 news_ingest.py(Python 표준 라이브러리만) — kustomization.yaml 의 configMapGenerator 가 ConfigMap 으로 얹는다(이미지를 굽지 않는다)
# 매일 10시(KST)에 전날 기사를 넣기만(load-only) 한다 — B1 은 AI 결과 덤프가 들어간 뒤(Jira 156). env 의 뜻 · 값은 infra/server/ingest.md 「설정」
# 손 실행(지난 날짜 · archive) · 로그 읽기 · 15분 모드 · 급히 멈추기도 infra/server/ingest.md
apiVersion: batch/v1
kind: CronJob
metadata:
  name: news-ingest
spec:
  # 2026-11-04 09:17 멈춤 — 받기만 한 번에 34시간 창 totalResults 25,961(하루 약 1만 8천 건, 팀장 어림 7,000 의 2.6배). 조건 없이는
  # 요청 상한 250 에서 그날 0 ~ 10시 기사가 먼저 먹어 전날은 저녁 몇 시간만 들어온다. 고르는 조건(INGEST_QUERY)을 받은 뒤 다시 false 로(Jira 156)
  suspend: true
  # 시각을 바꾸면 infra/k8s/alerts/rules.yaml 의 NewlearnIngestMissing(예약 25시간 기준)도 같이 고친다
  # 시작 마감이 1시간이라 10:00 ~ 11:00 에 머지 · 동기화되면 그 자리에서 한 번 돈다
  schedule: "0 10 * * *"
  timeZone: Asia/Seoul
  # 앞 실행이 안 끝났으면 겹쳐 돌지 않는다
  concurrencyPolicy: Forbid
  # 그 시각에 못 돌았으면(서버 재시작 등) 1시간 안에는 늦게라도 돈다 — 그래도 INGEST_DAYS=yesterday 는 같은 날을 가리킨다
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 종료 2 가 아닌 실패(종료 1 · 예상 못 한 오류 · 메모리 초과 등)면 한 번 다시 — 다시 돌면 NewsData 를 처음부터 또 부른다(요청 상한만큼 크레딧).
      # 같은 기사는 B2 200 으로 건너뛴다. 손 실행은 0 으로 바꿔 띄운다(ingest.md). 종료 코드 뜻은 infra/server/ingest.md 「로그 읽기」
      backoffLimit: 1
      # 종료 2 는 다시 해도 같다(설정 · 출입증 401 · 403 · 요청 · 기사 상한) — 다시 시도하지 않고 실패로 끝낸다(크레딧을 안 쓰게)
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              containerName: ingest
              operator: In
              values: [2]
      # 하루치(요청 약 210 + B2 7천 건 안팎)가 넉넉히 들어가는 시간. 손 실행 archive 는 2시간으로 올려 띄운다(ingest.md). 요청마다 20초 상한은 스크립트에.
      # 넘기면 다시 돌지 않고 실패한다. 경보 ①(3시간)은 시작 마감 1시간 + 이 값보다 길어야 한다
      activeDeadlineSeconds: 3600
      template:
        metadata:
          # app/netpol.yaml 의 backend-ingress 가 이 이름표만 8080 으로 들인다. DB · Redis 에는 직접 안 붙는다
          labels:
            app: news-ingest
        spec:
          restartPolicy: Never
          # 쿠버네티스 API 를 부르지 않는다
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ingest
              # CI 태그 MR 잡(.gitlab-ci.yml 의 w5:deploy-mr)과 같은 이미지 — 올릴 때 두 곳을 같이. PYTHON_VERSION 3.14.8 (2026-11-03 레지스트리에서 확인)
              image: python:3.14.8-slim-trixie@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
              # -I 는 env · 현재 폴더의 모듈을 안 읽고, -B 는 .pyc 를 안 쓰고(읽기 전용 파일 시스템), -u 는 로그를 바로 내보낸다(시간 상한에 잘려도 남게)
              command: ["python", "-I", "-B", "-u", "/opt/ingest/news_ingest.py"]
              env:
                # load-only = B2 만(B1 안 부름). 덤프가 들어간 뒤 full 로(Jira 156). fetch-only = NewsData 요청 하나만
                - name: INGEST_MODE
                  value: load-only
                # 매일 10시에 36시간 창 — 전날 0 ~ 24시를 덮고, 그날 0 ~ 10시 기사는 INGEST_DAYS 로 걸러진다(2026-11-03 AI 팀장 제안)
                - name: INGEST_SOURCE
                  value: latest
                - name: INGEST_TIMEFRAME
                  value: "36"
                - name: INGEST_DAYS
                  value: yesterday
                # 고르는 조건(분야 · 언론사) — 팀장에게 받으면 여기를 고친다. 받는 키는 news_ingest.py 의 QUERY_KEYS
                - name: INGEST_QUERY
                  value: country=kr&language=ko
                # 한 번 실행의 NewsData 요청(= 크레딧) · B2 로 보낼 기사 상한 — 하루 7,000건(팀장 공지)의 36시간 창이 약 210요청.
                # 다음 쪽이 남았는데 닿으면 받은 데까지 넣고 종료 2(경보). 첫 실행 뒤 다시 본다
                - name: INGEST_MAX_REQUESTS
                  value: "250"
                - name: INGEST_MAX_ARTICLES
                  value: "12000"
                - name: BACKEND_URL
                  value: http://backend.app.svc:8080
                # Secret 이 없으면 값이 비고, 스크립트가 까닭을 찍고 종료 2 — Pod 가 설정 오류로 멈춰 서 있지 않게 optional
                - name: NEWSDATA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: newsdata-api
                      key: NEWSDATA_API_KEY
                      optional: true
                # 직원용 문 출입증 중 배치 키 하나만 — 같은 Secret 의 워커 키는 이 Pod 로 오지 않는다(load-only · full 에서 쓴다)
                - name: INTERNAL_BATCH_KEY
                  valueFrom:
                    secretKeyRef:
                      name: internal-api
                      key: INTERNAL_BATCH_KEY
                      optional: true
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                # 기사는 거른 자리에서 B2 요청 모양만 남긴다 — 하루 1만 건 · archive 한 구간(UTC 이틀) 약 1만 4천 건이 들어가게
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /opt/ingest
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: news-ingest
