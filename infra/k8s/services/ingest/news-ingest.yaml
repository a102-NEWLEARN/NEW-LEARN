# 뉴스 수집 배치 — NewsData 최신 기사 → B2 기사 적재 → B1 분석 걸기 (Jira S15P31A102-154, 계획 docs/plans/2026-11-03-news-ingest-batch.md)
# 스크립트는 옆의 news_ingest.py(Python 표준 라이브러리만) — kustomization.yaml 의 configMapGenerator 가 ConfigMap 으로 얹는다(이미지를 굽지 않는다)
# 멈춘 채(suspend) · 받기만(fetch-only)으로 둔다. 켜기 · 숫자 · 시각은 팀 확정 뒤 Jira 156
# 손으로 받기만 돌리기 · 로그 읽기 · 켜기 · 급히 멈추기는 infra/server/ingest.md
apiVersion: batch/v1
kind: CronJob
metadata:
  name: news-ingest
spec:
  suspend: true
  # 시각을 바꾸면 infra/k8s/alerts/rules.yaml 의 NewlearnIngestMissing(예약 13시간 기준)도 같이 고친다
  schedule: "0 0,12 * * *"
  timeZone: Asia/Seoul
  # 앞 실행이 안 끝났으면 겹쳐 돌지 않는다
  concurrencyPolicy: Forbid
  # 그 시각에 못 돌았으면(서버 재시작 등) 1시간 안에는 늦게라도 돈다
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 종료 2 가 아닌 실패(종료 1 · 예상 못 한 오류 · 메모리 초과 등)면 한 번 다시 — 다시 돌면 NewsData 를 또 부른다(요청 상한만큼 크레딧).
      # 같은 기사는 B2 200 · B1 409 로 건너뛴다. 종료 코드 뜻은 infra/server/ingest.md 「로그 읽기」
      backoffLimit: 1
      # 종료 2 는 다시 해도 같다(설정 · 출입증 401 · 403) — 다시 시도하지 않고 실패로 끝낸다(크레딧을 안 쓰게)
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              containerName: ingest
              operator: In
              values: [2]
      # 기사 50 × (B2 + B1) 와 다시 걸기가 넉넉히 들어가는 시간. 요청마다 20초 상한은 스크립트에
      activeDeadlineSeconds: 900
      template:
        metadata:
          # app/netpol.yaml 의 backend-ingress 가 이 이름표만 8080 으로 들인다. DB · Redis 에는 직접 안 붙는다
          labels:
            app: news-ingest
        spec:
          restartPolicy: Never
          # 쿠버네티스 API 를 부르지 않는다
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ingest
              # CI 태그 MR 잡(.gitlab-ci.yml 의 w5:deploy-mr)과 같은 이미지 — 올릴 때 두 곳을 같이. PYTHON_VERSION 3.14.8 (2026-11-03 레지스트리에서 확인)
              image: python:3.14.8-slim-trixie@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
              # -I 는 env · 현재 폴더의 모듈을 안 읽고, -B 는 .pyc 를 안 쓰고(읽기 전용 파일 시스템), -u 는 로그를 바로 내보낸다(시간 상한에 잘려도 남게)
              command: ["python", "-I", "-B", "-u", "/opt/ingest/news_ingest.py"]
              env:
                # fetch-only = NewsData 요청 하나만 보내고 받은 수 · 견본을 찍는다(B2 · B1 안 부름). 켤 때 full 로(Jira 156)
                - name: INGEST_MODE
                  value: fetch-only
                # 한 번 실행에 B2 로 보낼 기사 · NewsData 요청 수 상한 — 00 · 12시 두 번에 하루 약 100건을 본 임시값(Jira 156 에서 정한다)
                - name: INGEST_MAX_ARTICLES
                  value: "50"
                - name: INGEST_MAX_REQUESTS
                  value: "3"
                - name: BACKEND_URL
                  value: http://backend.app.svc:8080
                # 봉인 전에는 Secret 이 없어 값이 비고, 스크립트가 까닭을 찍고 종료 2 — Pod 가 설정 오류로 멈춰 서 있지 않게 optional
                - name: NEWSDATA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: newsdata-api
                      key: NEWSDATA_API_KEY
                      optional: true
                # 직원용 문 출입증 중 배치 키 하나만 — 같은 Secret 의 워커 키는 이 Pod 로 오지 않는다(full 에서만 쓴다)
                - name: INTERNAL_BATCH_KEY
                  valueFrom:
                    secretKeyRef:
                      name: internal-api
                      key: INTERNAL_BATCH_KEY
                      optional: true
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /opt/ingest
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: news-ingest
