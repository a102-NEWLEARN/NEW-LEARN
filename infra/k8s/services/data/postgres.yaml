# PostgreSQL 18 + pgvector — 로컬 개발(compose.yaml)과 같은 이미지 · 마운트 경로
# 접속: postgres.data.svc:5432. 계정 · 비밀번호는 sealed-postgres-auth.yaml (infra/server/seal-secrets.sh db, 무작위)
# 데이터는 워커 디스크 하나에만 있다 — 워커를 잃으면 같이 잃는다. 백업은 postgres-backup.yaml(관리 서버, SSOT 6절 「저장소·백업」)
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  annotations:
    # 앱을 지우거나 Argo CD 가 prune 해도 DB 를 지우지 않는다 — 지울 때는 사람이 손으로
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  # StatefulSet 을 지우거나 줄여도 PVC(데이터)는 남긴다
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # 끝낼 때 체크포인트 · 연결 정리 시간을 준다
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg18
          ports:
            - name: postgres
              containerPort: 5432
          # POSTGRES_DB · POSTGRES_USER · POSTGRES_PASSWORD — 처음 초기화할 때만 읽는다
          envFrom:
            - secretRef:
                name: postgres-auth
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            # pg18 이미지는 /var/lib/postgresql/18/docker 에 쓴다 — 그 위 폴더를 마운트한다 (compose.yaml 과 같다)
            - name: data
              mountPath: /var/lib/postgresql
  # 크기 · StorageClass 는 나중에 못 바꾼다 (StatefulSet 의 volumeClaimTemplates)
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: newlearn-local
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
