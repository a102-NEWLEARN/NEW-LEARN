# backend (Spring Boot) — https://newlearn.io.kr/api · /actuator/health · Swagger 로 열린다 (routes.yaml)
# 무중단 교체 조건은 SSOT 6절 「무중단 배포 조건」: 새 Pod 먼저 · 준비 확인 · 끝낼 때 10초 기다림
# 이미지 태그는 kustomization.yaml 한 곳 (CI 태그 MR 이 바꾼다)
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 40
      containers:
        - name: backend
          image: ghcr.io/kimzoo5676-del/newlearn-backend
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres.data.svc
            - name: DB_PORT
              value: "5432"
            - name: REDIS_HOST
              value: redis.data.svc
            - name: REDIS_PORT
              value: "6379"
            # 로그인 세션 · CSRF 번호표 쿠키에 Secure 를 붙인다 — Envoy 가 TLS 를 풀어 앱은 http 로 받는다 (Jira 62)
            - name: SESSION_COOKIE_SECURE
              value: "true"
            # 컨테이너 상한(1Gi)의 70% 를 힙으로 — 자바 기본은 25% 다
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=70
            # 직원용 문(/internal/v1) 출입증 — 워커 키는 W1, 배치 키는 B1 만 연다 (Jira 30, docs/api-internal.md)
            # 봉인(seal-secrets.sh internal-api) 전에는 Secret 이 없어 값이 비고, 비면 직원용 문을 모두 막는다 — 닫힌 채로 시작
            - name: INTERNAL_WORKER_KEY
              valueFrom:
                secretKeyRef:
                  name: internal-api
                  key: INTERNAL_WORKER_KEY
                  optional: true
            - name: INTERNAL_BATCH_KEY
              valueFrom:
                secretKeyRef:
                  name: internal-api
                  key: INTERNAL_BATCH_KEY
                  optional: true
            # 용어사전(A19)이 부르는 표준국어대사전 Open API 키 (Jira 102, docs/api-screen.md A19)
            # 봉인(seal-secrets.sh stdict) 전에는 Secret 이 없어 값이 비고, 비면 사전을 부르지 않고 502 — 닫힌 채로 시작
            - name: STDICT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stdict-api
                  key: STDICT_API_KEY
                  optional: true
          # POSTGRES_DB · POSTGRES_USER · POSTGRES_PASSWORD (sealed-postgres-auth.yaml — data 의 DB 와 같은 값)
          envFrom:
            - secretRef:
                name: postgres-auth
          # 프로브는 스프링 전용 주소에 묻는다 (Jira 29). 무엇을 보는지는 backend 의 application.yaml 「management」
          # 처음 뜰 때 Flyway 마이그레이션까지 3분 안
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          # DB 가 안 되면 요청을 받지 않는다 (readiness 그룹은 DB 만 — Redis 는 2026-11-02 뺐다, Jira 145). 끊기면 앱이 30초 붙잡아
          # 기본 timeout 1초에 실패로 잡힌다 — 두 번(10초)이면 Envoy 목록에서 빠진다 (SSOT 10절 2026-10-28)
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 2
          # 앱이 망가졌을 때만 다시 띄운다 — liveness 그룹은 DB · Redis 를 보지 않아 DB 가 잠깐 끊겼다고 재시작하지 않는다
          # 포트만 보던 것을 앱이 실제로 답하는지로 바꿨다. 잠깐 느려도 재시작하지 않게 timeout 3초 · 20초마다 3번
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            timeoutSeconds: 3
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
