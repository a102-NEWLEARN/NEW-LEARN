# backend (Spring Boot) — https://newlearn.io.kr/api · /actuator/health · Swagger 로 열린다 (routes.yaml)
# 무중단 교체 조건은 SSOT 6절 「무중단 배포 조건」: 새 Pod 먼저 · 준비 확인 · 끝낼 때 10초 기다림
# 이미지 태그는 kustomization.yaml 한 곳 (CI 태그 MR 이 바꾼다)
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 40
      containers:
        - name: backend
          image: ghcr.io/kimzoo5676-del/newlearn-backend
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres.data.svc
            - name: DB_PORT
              value: "5432"
            - name: REDIS_HOST
              value: redis.data.svc
            - name: REDIS_PORT
              value: "6379"
            # 로그인 세션 · CSRF 번호표 쿠키에 Secure 를 붙인다 — Envoy 가 TLS 를 풀어 앱은 http 로 받는다 (Jira 62)
            - name: SESSION_COOKIE_SECURE
              value: "true"
            # 컨테이너 상한(1Gi)의 70% 를 힙으로 — 자바 기본은 25% 다
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=70
            # 직원용 문(/internal/v1) 출입증 — 워커 키는 W1, 배치 키는 B2 · B1 만 연다 (Jira 30 · 153, docs/api-internal.md)
            # 봉인(seal-secrets.sh internal-api) 전에는 Secret 이 없어 값이 비고, 비면 직원용 문을 모두 막는다 — 닫힌 채로 시작
            - name: INTERNAL_WORKER_KEY
              valueFrom:
                secretKeyRef:
                  name: internal-api
                  key: INTERNAL_WORKER_KEY
                  optional: true
            - name: INTERNAL_BATCH_KEY
              valueFrom:
                secretKeyRef:
                  name: internal-api
                  key: INTERNAL_BATCH_KEY
                  optional: true
            # 용어사전(A19)이 부르는 표준국어대사전 Open API 키 (Jira 102, docs/api-screen.md A19)
            # 봉인(seal-secrets.sh stdict) 전에는 Secret 이 없어 값이 비고, 비면 사전을 부르지 않고 502 — 닫힌 채로 시작
            - name: STDICT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stdict-api
                  key: STDICT_API_KEY
                  optional: true
            # 용어사전 문맥 뜻(A26)이 부르는 SSAFY GMS (Jira 187, docs/api-screen.md A26). 주소 · 모델은 AI 워커와 같은 값이다 —
            # 바꿀 때는 infra/k8s/services/ai/ai.yaml 의 GMS_BASE_URL · GMS_MODEL 과 같이 바꾼다
            - name: GMS_BASE_URL
              value: https://gms.ssafy.io/gmsapi/api.openai.com/v1
            - name: GMS_MODEL
              value: gpt-6-luna
            # 키는 AI 워커와 같은 팀 공용키를 app 에 따로 봉인한 Secret gms-api(seal-secrets.sh gms-app).
            # 봉인 전에는 값이 비고, 비면 GMS 를 부르지 않고 502 — 닫힌 채로 시작
            - name: GMS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gms-api
                  key: GMS_API_KEY
                  optional: true
            # 하루에 GMS 를 부르는 수의 상한(팀 공용 예산). 0 이면 GMS 를 부르지 않는다 — 끄는 스위치(바꾸면 Pod 를 다시 띄운다)
            - name: MEANING_DAILY_LIMIT
              value: "3000"
            # 이슈 붙이기(ATTACH)가 기존 이슈의 요약을 다시 쓰고 분야를 다시 계산할지 (Jira S15P31A102-207).
            # 발표(11-18)까지 "false" — 사건은 이슈에 붙이되 발표에 쓸 요약 · 분야는 그대로 둔다. 분야 다시 계산은
            # 고정 28개 목록을 보지 않아 매일 아침 라벨 적용 전까지 어긋난다. 기본값은 "true"(계약대로, api-internal.md 5절)
            - name: ISSUE_REWRITE_SUMMARY_ON_ATTACH
              value: "false"
            # 후보 이슈로 올릴 코사인 거리의 상한 (Jira S15P31A102-206 후속). "2.0" 이 끄는 값이다 — 되돌릴 때는
            # 이름을 지우지 말고 값을 "2.0" 으로. 2026-11-14 측정: 이슈에 잘못 붙은 34건 중 넷이 거리 0.40 밖이었고,
            # 그 밖을 버려도 맞게 붙은 1,364건은 하나도 잃지 않는다. 2026-11-09 오프라인 실험이 쓴 값과 같다
            - name: ISSUE_MAX_CANDIDATE_DISTANCE
              value: "0.40"
            # 화면에 보일 사건의 최소 공개 기사 수 (Jira S15P31A102-206 후속). 되돌릴 때는 이름을 지우지 말고 값을 "1" 로.
            # 2026-11-14 측정: 3 이면 이슈 쌍 정밀도 0.930 → 0.976. 사건 376개 · 이슈 19개가 화면에서 사라진다(243 → 224)
            - name: QUERY_MIN_PUBLIC_ARTICLES
              value: "3"
            # 이슈가 목록에 나오려면 보이는 사건이 몇 개 있어야 하는가 (Jira S15P31A102-208). 되돌릴 때는 값을 "1" 로.
            # 2026-11-15: 보이는 이슈 225개 중 26개가 사건 1 ~ 2개뿐이었다(사건을 뗀 뒤 남은 것). 3 으로 두면 225 → 199.
            # 목록에서만 뺀다 — 이슈 페이지와 기사 · 사건의 이슈 링크, 관심 이슈는 그대로다.
            # 2026-11-15 켬. 켜기 전 응답 시간은 C:/tmp/208-steps/before.md 에 적어 두고 켠 뒤 같은 방법으로 다시 잰다 —
            # SSH 터널이 없어 실행 계획(EXPLAIN) 대신 공개 주소에서 전후를 쟀다. 느려지면 값을 "1" 로 되돌린다(1 ~ 2분)
            - name: QUERY_MIN_PUBLIC_EVENTS
              value: "3"
          # POSTGRES_DB · POSTGRES_USER · POSTGRES_PASSWORD (sealed-postgres-auth.yaml — data 의 DB 와 같은 값)
          envFrom:
            - secretRef:
                name: postgres-auth
          # 프로브는 스프링 전용 주소에 묻는다 (Jira 29). 무엇을 보는지는 backend 의 application.yaml 「management」
          # 처음 뜰 때 Flyway 마이그레이션까지 3분 안
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          # DB 가 안 되면 요청을 받지 않는다 (readiness 그룹은 DB 만 — Redis 는 2026-11-02 뺐다, Jira 145). 끊기면 앱이 30초 붙잡아
          # 기본 timeout 1초에 실패로 잡힌다 — 두 번(10초)이면 Envoy 목록에서 빠진다 (SSOT 10절 2026-10-28)
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 2
          # 앱이 망가졌을 때만 다시 띄운다 — liveness 그룹은 DB · Redis 를 보지 않아 DB 가 잠깐 끊겼다고 재시작하지 않는다
          # 포트만 보던 것을 앱이 실제로 답하는지로 바꿨다. 잠깐 느려도 재시작하지 않게 timeout 3초 · 20초마다 3번
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            timeoutSeconds: 3
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
