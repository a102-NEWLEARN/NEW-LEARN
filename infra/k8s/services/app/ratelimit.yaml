# 주소(IP)별 요청 수 상한 — 로그인 없이 부르는 A19 용어사전 · A15 로그인 · A14 가입 (Jira S15P31A102-135, 2026-10-29 사용자)
# 무차별 대입(로그인) · 계정 찍어 내기(가입)를 입구에서 막는다. 용어사전은 사전 하루 한도가 한 IP 때문에 빨리 바닥나지 않게 늦출 뿐이고(IP 하나가 1분 100건이면 하루 144,000건)
#   하루 한도 45,000건은 앱이 따로 센다(docs/api-screen.md A19)
# global 상한이다 — Envoy 가 요청마다 상한 서비스(envoy-ratelimit, envoy-gateway-system)에 묻고, 상한 서비스가 Redis 에 센다
#   켜는 설정은 apps/templates/envoy-gateway.yaml 의 Helm 값, Redis 로 가는 길은 data/netpol.yaml
#   local(Envoy 안에서 세기)로 처음 걸었지만 「IP 마다」(sourceCIDR Distinct)가 v1.9.2 에서 동작하지 않았다 — 2026-10-29 실측(102번 모두 통과, rate_limited 0)
#   상한 서비스나 Redis 가 죽으면 상한이 풀리고 요청은 통과한다(failClosed 기본 false) — 사이트는 그대로 돈다
# 손님 IP 는 Envoy 가 직접 본다 — hostPort 로 받아 앞에 다른 프록시가 없다(2026-10-29 접근 로그에서 서로 다른 공인 주소 43개 확인, SSOT 6절)
# sourceCIDR Distinct 0.0.0.0/0 — IP 하나마다 바구니 하나. 같은 공인 IP 를 여럿이 쓰면(발표장 와이파이) 바구니도 하나다
#   그래서 가입 100 · 로그인 300 으로 넉넉히 둔다 — QA · 발표(11-18) 때 교육생 · 심사위원이 같은 와이파이를 쓴다(2026-10-30 사용자, Jira 137)
#   처음 숫자는 가입 10 · 로그인 20 이었다(Jira 135). 막는다기보다 늦춘다 — 로그인 300 이면 IP 하나가 하루 432,000번, 아이디별 5회 잠금과 합쳐도
#   1분에 아이디 약 60개 × 비밀번호 5개를 시도할 수 있고, 가입 100 이면 하루 144,000 계정이다(가입은 세션도 연다 — SSOT 6절 「외부 입구」, 운영이 끝날 때까지 이 숫자). 한 아이디 무차별 대입은 아이디별 잠금이 막는다
#   IPv4 만 센다 — IPv6 를 열면(도메인 AAAA 등) ::/0 규칙을 셋에 같이 넣는다. 안 넣으면 IPv6 손님은 상한 밖이다
# 넘으면 Envoy 가 429 를 만든다. responseOverride 의 source: Local 로 Envoy 가 만든 응답만 우리 오류 모양으로 바꾼다 —
#   백엔드의 로그인 잠금 429 TOO_MANY_REQUESTS(같은 아이디 5번 틀림)는 그대로 지나간다. 둘은 화면 안내가 달라 코드를 나눈다(docs/api.md 2절)
#   본문은 고정 글이라 instance 칸이 없다
# 규칙 이름(sectionName)은 routes.yaml 의 HTTPRoute app 에 붙인 이름이다 — 이름을 바꾸면 이 파일도 같이 바꾼다
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: dictionary-rate-limit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: app
      sectionName: dictionary
  rateLimit:
    global:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 100
            unit: Minute
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 429
      source: Local
      response:
        contentType: application/problem+json
        header:
          set:
            - name: Retry-After
              value: "60"
        body:
          type: Inline
          inline: '{"title":"Too Many Requests","status":429,"detail":"주소별 요청 수 상한(1분 100건)을 넘었다","code":"RATE_LIMITED"}'
