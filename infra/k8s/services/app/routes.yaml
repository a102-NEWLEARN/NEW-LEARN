# https://newlearn.io.kr 의 길 — https 리스너에만 붙는다(http 는 넘기기, gateway/redirects.yaml)
# /internal/v1 은 일부러 없다 — 워커 · 배치가 부르는 내부 API 는 밖에 열지 않는다 (docs/api.md)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - newlearn.io.kr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 8080
    # 헬스는 이 한 경로만 연다 — 다른 actuator 경로는 밖에 안 연다
    - matches:
        - path:
            type: Exact
            value: /actuator/health
      backendRefs:
        - name: backend
          port: 8080
    # Swagger — 개발하는 동안 FE 가 편하게 잠그지 않는다 (SSOT 6절 「도메인 · HTTPS」, 다시 잠글지는 8절)
    # backend 의 springdoc(Jira 107) — 첫 주소 /swagger-ui.html 은 화면 /swagger-ui/index.html 로 넘긴다
    # /swagger-ui.html 은 접두사 /swagger-ui 에 걸리지 않아(경로 조각 단위) 정확 경로로 따로 둔다 — 없으면 아래 / 규칙으로 frontend 가 받는다
    # 다시 잠글 때는 이 규칙과 backend 의 SecurityConfig 허용 줄을 같이 뺀다
    - matches:
        - path:
            type: Exact
            value: /swagger-ui.html
        - path:
            type: PathPrefix
            value: /swagger-ui
        - path:
            type: PathPrefix
            value: /v3/api-docs
      backendRefs:
        - name: backend
          port: 8080
    # 화면 응답의 보안 머리 (Jira S15P31A102-120) — /api · Swagger 에는 스프링 시큐리티가 HSTS · nosniff · X-Frame-Options 셋을 붙이고, 화면(nginx)에는 없었다
    # nginx 에 두지 않는 까닭: location 에 add_header 가 있으면 바깥 add_header 를 물려받지 않는다(frontend/nginx.conf 의 /index.html · /assets/)
    # CSP 는 아직 보고만(Report-Only) — 위반은 브라우저 콘솔에만 뜨고 막지 않는다. 강제로 바꿀 때는 SSOT 8절
    #   script-src 의 sha256 은 seed-design 플러그인(frontend/vite.config.ts)이 index.html 에 넣는 테마 초기화 script 하나다 — 2026-10-27 사이트 index.html 에서 잼
    #   글은 @seed-design/css(frontend/package.json)의 generateThemingScript 가 만든다 — 그 패키지 판이나 플러그인 설정(colorMode · fontScaling)이 바뀌면 이 해시도 같이 바꾼다
    #   style-src 의 'unsafe-inline' 은 vite.config.ts 가 넣는 @layer 순서 한 줄 · 런타임에 붙는 스타일 몫
    #   img-src 의 data: 는 Vite 가 로고 SVG(frontend/src/components/Logo.tsx)를 data: 주소로 번들에 넣어서 — 빼면 강제 단계에서 로고가 깨진다
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000 ; includeSubDomains
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: DENY
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: Content-Security-Policy-Report-Only
                value: "default-src 'self'; script-src 'self' 'sha256-YBQY3WM31w/XgUZiCAkDXyEKGqOEfxNRIDEAoPoaHXY='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      backendRefs:
        - name: frontend
          port: 8080
