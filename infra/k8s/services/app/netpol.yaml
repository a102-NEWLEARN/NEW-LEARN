# backend · frontend 로 들어오는 길 — 실제로 부르는 Pod 만 (Jira S15P31A102-121)
# 손님 요청은 공개 Gateway 의 Envoy 를 거쳐서만 온다(routes.yaml). AI 워커가 분석 결과를 W1 로 보낼 길도 연다(ai/ai.yaml 의 BACKEND_URL — 2026-10-27 워커 코드는 아직 안 보낸다, 자리만)
# 그대로 남는 길: 워커 노드 호스트에서 오는 것(kubelet 상태 확인 · 호스트 네트워크 Pod) — Cilium 은 로컬 호스트 통신을 기본으로 허용한다
# 나중에 backend 지표를 Prometheus(monitoring, 관리 서버)가 긁게 하면 그 길을 여기 더한다
# 클러스터 안에서 backend 를 직접 시험할 때는 시험 Pod 대신 `kubectl -n app port-forward svc/backend` 를 쓴다 — Pod 안 localhost 로 들어가 정책 밖이다
# 네임스페이스 이름표가 없는 규칙은 이 정책의 네임스페이스(app)로 한정된다
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backend-ingress
spec:
  endpointSelector:
    matchLabels:
      app: backend
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-name: public
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app: ai
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: frontend-ingress
spec:
  endpointSelector:
    matchLabels:
      app: frontend
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-name: public
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
