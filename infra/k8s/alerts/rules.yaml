# 경보 여섯 — Mattermost 「A102 배포알림」 채널로 간다 (2026-10-30 사용자, Jira S15P31A102-138, 계획 docs/plans/2026-10-30-alertmanager-mattermost.md)
# notify: mattermost 이름표가 있어야 채널로 간다 — 받는 길은 infra/k8s/bootstrap/monitoring-values.yaml 의 alertmanager.config
#   차트 기본 경보 규칙은 이 이름표가 없어 채널로 안 간다(평가만)
# release: kps 이름표가 있어야 Prometheus 가 이 규칙을 읽는다(ruleSelector, 2026-10-30 확인)
# 범위는 「꼭 필요한 것만」, Pod · 서비스는 app · ai · data 전부(2026-10-30 사용자). 숫자는 처음 며칠 실제로 몇 번 오는지 보고 고친다
# 식을 바꾸면 먼저 Prometheus 에 그대로 물어 지금 값을 본다(SSOT 6절 「모니터링」)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: newlearn-alerts
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
    - name: newlearn
      rules:
        # 상한 서비스나 Redis 를 못 부르면 Envoy 는 요청을 막지 않고 통과시킨다(failClosed false) — 사이트는 멀쩡해 보여 경보로만 안다
        # 쌓인 수의 10분 차이로 본다. 처음 풀릴 때 줄이 새로 생겨 increase() 는 첫 묶음을 놓친다(SSOT 6절 「외부 입구」)
        # for 2m — Envoy 수집이 한 번 실패하면 10분 뒤 offset 쪽이 끊김 표시로 비어 or vector(0) 이 0 을 넣는다.
        #   그러면 한 번이라도 풀린 뒤에는(누적 > 0) 거짓으로 울린다. 진짜로 풀리면 차이가 10분 동안 남아 2분 기다려도 울린다 (리뷰 2026-10-30)
        - alert: NewlearnRateLimitFailOpen
          expr: |
            (sum(envoy_cluster_ratelimit_failure_mode_allowed) or vector(0)) - (sum(envoy_cluster_ratelimit_failure_mode_allowed offset 10m) or vector(0)) > 0
            or
            (sum(envoy_cluster_ratelimit_error) or vector(0)) - (sum(envoy_cluster_ratelimit_error offset 10m) or vector(0)) > 0
          for: 2m
          labels:
            notify: mattermost
            severity: warning
          annotations:
            summary: 입구 요청 수 상한이 풀렸다 — 상한 서비스를 못 불러 요청을 그냥 통과시켰다
            description: "kubectl -n envoy-gateway-system get pod 와 data/redis 를 본다. 질의는 SSOT 6절 「외부 입구」"
        # 수집이 끊기면 위 경보가 0 으로 보여 믿을 수 없다 — 대상이 0 이 되거나 아예 사라진 것을 따로 잡는다
        # 대상 둘(Envoy · 상한 서비스)을 따로 absent 로 본다. 한데 묶으면 둘 다 없을 때만 참이라, 풀림 수를 내는 Envoy 대상만 빠지면 못 잡는다
        #   (판을 올리며 Pod 이름표 · 포트 이름이 바뀌면 일어남 — ratelimit-podmonitor.yaml 주석, 리뷰 2026-10-30). job 이름은 2026-10-30 Prometheus 에서 확인
        - alert: NewlearnRateLimitMetricsMissing
          expr: |
            up{namespace="envoy-gateway-system"} == 0
            or
            absent(up{namespace="envoy-gateway-system", job="envoy-gateway-system/envoy-proxy-ratelimit"})
            or
            absent(up{namespace="envoy-gateway-system", job="envoy-gateway-system/envoy-ratelimit"})
          for: 5m
          labels:
            notify: mattermost
            severity: warning
          annotations:
            summary: 입구 상한 지표를 못 모은다 — 상한 풀림 경보를 믿을 수 없다
            description: "PodMonitor 는 infra/k8s/gateway/ratelimit-podmonitor.yaml. Prometheus 화면 Status › Targets 에서 envoy-gateway-system 을 본다"
        # increase 는 창 끝까지 늘려 잡아 값을 키우기만 한다 — 30초 수집이면 2번이 약 2.07 이라 > 2 면 2번에 울린다. 3번부터 울리게 > 2.5 (리뷰 2026-10-30)
        - alert: NewlearnPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace=~"app|ai|data"}[15m]) > 2.5
          labels:
            notify: mattermost
            severity: warning
          annotations:
            summary: '{{ $labels.namespace }}/{{ $labels.pod }} 의 {{ $labels.container }} 가 15분 안에 {{ $value | printf "%.0f" }}번쯤 다시 떴다'
            description: "kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous 로 죽기 전 로그를 본다. 지나간 로그는 Grafana › Explore › Loki"
        # 하나도 준비되지 않은 채 3분 — 교체(새 Pod 가 준비된 뒤 옛 Pod 를 내림)나 잠깐의 재시작은 거른다. 일부러 0 으로 줄인 것은 뺀다
        - alert: NewlearnServiceDown
          expr: |
            (kube_deployment_status_replicas_available{namespace=~"app|ai"} < 1) and on (namespace, deployment) (kube_deployment_spec_replicas > 0)
            or
            (kube_statefulset_status_replicas_ready{namespace="data"} < 1) and on (namespace, statefulset) (kube_statefulset_replicas > 0)
          for: 3m
          labels:
            notify: mattermost
            severity: critical
          annotations:
            summary: '{{ $labels.namespace }}/{{ $labels.deployment }}{{ $labels.statefulset }} 이 하나도 준비되지 않았다'
            description: "kubectl -n {{ $labels.namespace }} get pod · describe pod 로 이유를 본다. Argo CD 화면에서 앱 상태도"
        # 켜던 날 관리 서버(컨트롤 플레인) 루트는 73%(29G). Prometheus · 백업 7일치 · 이미지 · CI 캐시가 같은 디스크를 쓴다
        # 80% 에서 미리 알린다 — kubelet 은 85% 에서 안 쓰는 이미지를 지우고(imageGCHighThresholdPercent 85), 같은 선에서
        #   Pod 를 내쫓기 시작한다(evictionHard imagefs.available<15% — 디스크가 하나라 같은 선). 두 노드 configz 로 확인(2026-11-02)
        #   Prometheus 보존을 7일로 줄여(monitoring-values.yaml) 평소 자리를 80% 아래로 둔다 (Jira S15P31A102-141)
        - alert: NewlearnDiskAlmostFull
          expr: |
            1 - node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} > 0.80
          for: 10m
          labels:
            notify: mattermost
            severity: warning
          annotations:
            summary: '노드 {{ $labels.instance }} 루트 디스크 {{ $value | humanizePercentage }} 사용'
            description: "df -h / · sudo du -xh --max-depth=1 / | sort -h 로 큰 곳을 본다. 이미지 정리는 infra/server/alerts.md 「디스크 경보」대로(--prune 은 CI 이미지까지 지운다)"
        # 실패한 잡 수가 아니라 「마지막 성공이 오래됨」으로 본다 — 실패 기록은 3개까지 남아 다음 성공 뒤에도 울리기 때문이다
        # 매일(04:00) 26시간 · 주간 S3(일요일 05:00) 8일. 지표가 아예 없으면(CronJob 이름이 바뀜) absent 로 잡는다 — 그때 값은 1
        - alert: NewlearnBackupMissing
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="data", cronjob="postgres-backup"} > 26 * 3600
            or
            time() - kube_cronjob_status_last_successful_time{namespace="data", cronjob="postgres-backup-s3"} > 8 * 86400
            or
            absent(kube_cronjob_status_last_successful_time{namespace="data", cronjob="postgres-backup"})
            or
            absent(kube_cronjob_status_last_successful_time{namespace="data", cronjob="postgres-backup-s3"})
          # kube-state-metrics 수집이 한 번 실패하거나 Pod 가 바뀌면 absent 가 잠깐 참이 된다 — 기준이 시간 단위라 10분 기다려도 손해가 없다 (리뷰 2026-10-30)
          for: 10m
          labels:
            notify: mattermost
            severity: critical
          annotations:
            summary: 'DB 백업 {{ $labels.cronjob }} 의 마지막 성공이 {{ $value | humanizeDuration }} 전이다 (값이 1s 면 지표가 없음)'
            description: "kubectl -n data get jobs · logs job/<이름>. 손으로 돌리는 법은 infra/server/db-backup.md"
