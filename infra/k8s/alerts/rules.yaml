# 경보 열 — Mattermost 「A102 배포알림」 채널로 간다 (2026-10-30 사용자, Jira S15P31A102-138, 계획 docs/plans/2026-10-30-alertmanager-mattermost.md)
# notify: mattermost 이름표가 있어야 채널로 간다 — 받는 길은 infra/k8s/bootstrap/monitoring-values.yaml 의 alertmanager.config
#   차트 기본 경보 규칙은 이 이름표가 없어 채널로 안 간다(평가만)
# release: kps 이름표가 있어야 Prometheus 가 이 규칙을 읽는다(ruleSelector, 2026-10-30 확인)
# 범위는 「꼭 필요한 것만」, Pod · 서비스는 app · ai · data 전부(2026-10-30 사용자). 숫자는 처음 며칠 실제로 몇 번 오는지 보고 고친다
#   로그 수집(Alloy) · 창고(Loki)는 2026-11-11 더함 — 수집이 멈추거나 로그를 버려도 알 길이 없었다 (Jira S15P31A102-192, 계획 docs/plans/2026-11-11-log-pipeline-hardening.md)
#   분석 작업(analysis_job)은 2026-11-16 더함 — EXTRACT 가 끝내 실패해도 사람이 DB 를 세기 전에는 몰랐다 (Jira S15P31A102-215, 계획 docs/plans/2026-11-15-analysis-job-alerts.md)
# 식을 바꾸면 먼저 Prometheus 에 그대로 물어 지금 값을 본다(SSOT 6절 「모니터링」)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: newlearn-alerts
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
    - name: newlearn
      rules:
        # 상한 서비스나 Redis 를 못 부르면 Envoy 는 요청을 막지 않고 통과시킨다(failClosed false) — 사이트는 멀쩡해 보여 경보로만 안다
        # 쌓인 수의 10분 차이로 본다. 처음 풀릴 때 줄이 새로 생겨 increase() 는 첫 묶음을 놓친다(SSOT 6절 「외부 입구」)
        # for 2m — Envoy 수집이 한 번 실패하면 10분 뒤 offset 쪽이 끊김 표시로 비어 or vector(0) 이 0 을 넣는다.
        #   그러면 한 번이라도 풀린 뒤에는(누적 > 0) 거짓으로 울린다. 진짜로 풀리면 차이가 10분 동안 남아 2분 기다려도 울린다 (리뷰 2026-10-30)
        - alert: NewlearnRateLimitFailOpen
          expr: |
            (sum(envoy_cluster_ratelimit_failure_mode_allowed) or vector(0)) - (sum(envoy_cluster_ratelimit_failure_mode_allowed offset 10m) or vector(0)) > 0
            or
            (sum(envoy_cluster_ratelimit_error) or vector(0)) - (sum(envoy_cluster_ratelimit_error offset 10m) or vector(0)) > 0
          for: 2m
          labels:
            notify: mattermost
            severity: warning
          annotations:
            summary: 입구 요청 수 상한이 풀렸다 — 상한 서비스를 못 불러 요청을 그냥 통과시켰다
            description: "kubectl -n envoy-gateway-system get pod 와 data/redis 를 본다. 질의는 SSOT 6절 「외부 입구」"
        # 수집이 끊기면 위 경보가 0 으로 보여 믿을 수 없다 — 대상이 0 이 되거나 아예 사라진 것을 따로 잡는다
        # 대상 둘(Envoy · 상한 서비스)을 따로 absent 로 본다. 한데 묶으면 둘 다 없을 때만 참이라, 풀림 수를 내는 Envoy 대상만 빠지면 못 잡는다
        #   (판을 올리며 Pod 이름표 · 포트 이름이 바뀌면 일어남 — ratelimit-podmonitor.yaml 주석, 리뷰 2026-10-30). job 이름은 2026-10-30 Prometheus 에서 확인
        - alert: NewlearnRateLimitMetricsMissing
          expr: |
            up{namespace="envoy-gateway-system"} == 0
            or
            absent(up{namespace="envoy-gateway-system", job="envoy-gateway-system/envoy-proxy-ratelimit"})
            or
            absent(up{namespace="envoy-gateway-system", job="envoy-gateway-system/envoy-ratelimit"})
          for: 5m
          labels:
            notify: mattermost
            severity: warning
          annotations:
            summary: 입구 상한 지표를 못 모은다 — 상한 풀림 경보를 믿을 수 없다
            description: "PodMonitor 는 infra/k8s/gateway/ratelimit-podmonitor.yaml. Prometheus 화면 Status › Targets 에서 envoy-gateway-system 을 본다"
        # increase 는 창 끝까지 늘려 잡아 값을 키우기만 한다 — 30초 수집이면 2번이 약 2.07 이라 > 2 면 2번에 울린다. 3번부터 울리게 > 2.5 (리뷰 2026-10-30)
        # monitoring 에서는 로그 수집 · 창고(alloy · loki)만 본다 — 메모리 상한에 닿아 되풀이해 죽는 것(OOMKill)을 잡는다 (Jira S15P31A102-192)
        - alert: NewlearnPodRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace=~"app|ai|data"}[15m]) > 2.5
            or
            increase(kube_pod_container_status_restarts_total{namespace="monitoring", container=~"alloy|loki"}[15m]) > 2.5
          labels:
            notify: mattermost
            severity: warning
          annotations:
            summary: '{{ $labels.namespace }}/{{ $labels.pod }} 의 {{ $labels.container }} 가 15분 안에 {{ $value | printf "%.0f" }}번쯤 다시 떴다'
            description: "kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous 로 죽기 전 로그를 본다. 지나간 로그는 Grafana › Explore › Loki"
        # 하나도 준비되지 않은 채 3분 — 교체(새 Pod 가 준비된 뒤 옛 Pod 를 내림)나 잠깐의 재시작은 거른다. 일부러 0 으로 줄인 것은 뺀다
        - alert: NewlearnServiceDown
          expr: |
            (kube_deployment_status_replicas_available{namespace=~"app|ai"} < 1) and on (namespace, deployment) (kube_deployment_spec_replicas > 0)
            or
            (kube_statefulset_status_replicas_ready{namespace="data"} < 1) and on (namespace, statefulset) (kube_statefulset_replicas > 0)
          for: 3m
          labels:
            notify: mattermost
            severity: critical
          annotations:
            summary: '{{ $labels.namespace }}/{{ $labels.deployment }}{{ $labels.statefulset }} 이 하나도 준비되지 않았다'
            description: "kubectl -n {{ $labels.namespace }} get pod · describe pod 로 이유를 본다. Argo CD 화면에서 앱 상태도"
        # 켜던 날 관리 서버(컨트롤 플레인) 루트는 73%(29G). Prometheus · 백업 7일치 · 이미지 · CI 캐시가 같은 디스크를 쓴다
        # 80% 에서 미리 알린다 — 85% 에서 kubelet 이 DiskPressure 가 된다(evictionHard imagefs.available<15%, 디스크가 하나라 루트 기준.
        #   두 노드 configz 로 확인, 2026-11-02). 그러면 안 쓰는 이미지(CI 이미지 포함)부터 지우고, 그래도 넘치면 Pod 를 내쫓는다.
        #   그동안 노드에 disk-pressure NoSchedule 테인트가 붙어 관리 서버에 묶인 CI 잡 · 백업 CronJob 이 뜨지 못한다
        #   Prometheus 보존을 7일로 줄였지만(monitoring-values.yaml) 나머지(이미지 · CI 캐시 등으로 짐작)는 계속 는다 — 울리면 alerts.md 대로 (Jira S15P31A102-141)
        - alert: NewlearnDiskAlmostFull
          expr: |
            1 - node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} > 0.80
          for: 10m
          labels:
            notify: mattermost
            severity: warning
          annotations:
            summary: '노드 {{ $labels.instance }} 루트 디스크 {{ $value | humanizePercentage }} 사용'
            description: "df -h / · sudo du -xh --max-depth=2 /var/lib | sort -h | tail 로 큰 곳을 본다. 이미지 정리는 infra/server/alerts.md 「디스크 경보가 오면」대로(--prune 은 CI 이미지까지 지운다)"
        # 실패한 잡 수가 아니라 「마지막 성공이 오래됨」으로 본다 — 실패 기록은 3개까지 남아 다음 성공 뒤에도 울리기 때문이다
        # 매일(04:00) 26시간 · 주간 S3(일요일 05:00) 8일. 지표가 아예 없으면(CronJob 이름이 바뀜) absent 로 잡는다 — 그때 값은 1
        - alert: NewlearnBackupMissing
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="data", cronjob="postgres-backup"} > 26 * 3600
            or
            time() - kube_cronjob_status_last_successful_time{namespace="data", cronjob="postgres-backup-s3"} > 8 * 86400
            or
            absent(kube_cronjob_status_last_successful_time{namespace="data", cronjob="postgres-backup"})
            or
            absent(kube_cronjob_status_last_successful_time{namespace="data", cronjob="postgres-backup-s3"})
          # kube-state-metrics 수집이 한 번 실패하거나 Pod 가 바뀌면 absent 가 잠깐 참이 된다 — 기준이 시간 단위라 10분 기다려도 손해가 없다 (리뷰 2026-10-30)
          for: 10m
          labels:
            notify: mattermost
            severity: critical
          annotations:
            summary: 'DB 백업 {{ $labels.cronjob }} 의 마지막 성공이 {{ $value | humanizeDuration }} 전이다 (값이 1s 면 지표가 없음)'
            description: "kubectl -n data get jobs · logs job/<이름>. 손으로 돌리는 법은 infra/server/db-backup.md"
        # 뉴스 수집(Jira S15P31A102-154 · 156, infra/k8s/services/ingest) — 15분마다 30분 창. 멈춘 동안(suspend)은 보지 않는다
        # ① 마지막 성공이 30분 넘게 없음 — 두 번 연속 실패부터 기사가 빠져서. 예약이 15분마다 새로 생기니 예약 시각과 견주면 계속 실패해도 안 울린다
        # ② 예약 실행이 30분 넘게 없음 ③ 성공 기록 줄이 아예 없음(CronJob 을 새로 만든 뒤 등)
        # 한계: 손으로 돌린 잡(create job --from)의 성공도 ①을 늦춘다(최대 30분). 오래 멈췄다 다시 켜면 첫 성공 전까지 울릴 수 있다
        # 시각을 바꾸면 infra/ci/alert_rules_test.yaml 도 같이 고친다. 실행 상한(activeDeadlineSeconds 14분)보다 길어야 한다
        - alert: NewlearnIngestMissing
          expr: |
            (
              time() - kube_cronjob_status_last_successful_time{namespace="app", cronjob="news-ingest"} > 30 * 60
              or
              time() - kube_cronjob_status_last_schedule_time{namespace="app", cronjob="news-ingest"} > 30 * 60
              or
              (kube_cronjob_spec_suspend{namespace="app", cronjob="news-ingest"} unless on (namespace, cronjob) kube_cronjob_status_last_successful_time{namespace="app", cronjob="news-ingest"})
            )
            and on (namespace, cronjob)
            kube_cronjob_spec_suspend{namespace="app", cronjob="news-ingest"} == 0
          for: 5m
          labels:
            notify: mattermost
            severity: warning
          annotations:
            summary: '뉴스 수집 · 자동 투입 {{ $labels.cronjob }} — 마지막 성공 또는 예약 실행 뒤 {{ $value | humanizeDuration }} 지났거나 성공 기록이 없다'
            description: "kubectl -n app get jobs · kubectl -n app logs job/<이름>. 결과 줄 release.skippedBy 가 wait · failing 이면 수집은 됐고 분석 줄이 막힌 것. 볼 것 · 멈추는 법은 infra/server/ingest.md 「경보가 오면」"
        # 로그 수집(Alloy, infra/k8s/bootstrap/alloy-values.yaml) — 아래 셋 (Jira S15P31A102-192). 볼 것은 infra/server/alerts.md 「로그 경보가 오면」
        # ① Loki 로 못 보냈다고 Alloy 가 센 줄. 사유마다 뜻이 다르다(alerts.md) — ingester_error(대개 400)는 Loki 가 받을 수 있는 줄을 저장하고도
        #   Alloy 가 묶음 전체를 세어 실제보다 크다(실제로 빠진 줄은 Loki loki_discarded_samples_total). rate_limited 는 재시도를 다 써 실제로 빠진 줄.
        #   어느 쪽이든 책갈피가 사라졌거나 Loki 가 막혔다는 뜻이라 기다리지 않는다
        #   Alloy 는 시작할 때 사유 다섯 줄(batch_too_large · ingester_error · queue_is_full · rate_limited · stream_limited)을 0 으로 만들어 둔다 —
        #   그래서 같은 Pod 안의 증가는 위 상한 경보(Envoy)와 달리 increase() 가 놓치지 않는다 (2026-11-11 Alloy /metrics 로 확인).
        #   그러나 Pod 가 새로 떠 이름이 바뀌면 새 시계열이라, 첫 수집(30초 안쪽) 전에 센 몫은 increase() 가 0 으로 본다 —
        #   2026-11-11 워커 Alloy 를 지운 실험에서 다시 보내기가 15초 안에 끝나 첫 수집 값이 이미 123,167 이었고 경보가 안 울렸다.
        #   그래서 둘째 갈래: 지금 0 이 아닌데 10분 전에는 그 줄이 없었다(새 Pod) → 나타난 뒤 10분 동안 울린다
        #   한계: Prometheus 가 10분 넘게 못 모았다가 다시 모으면, 옛 Pod 의 0 이 아닌 누적값도 새 줄처럼 보여 한 번 울릴 수 있다
        #   한계: 수집 대상이 통째로 사라지면 조용하다 — job 이름이 반영 뒤에 정해져 absent 를 쓰지 않았다.
        #   Loki 가 멈추면 Alloy 가 재시도를 다 쓴 뒤에야(몇 분) 여기로 보인다
        - alert: NewlearnLogsDropped
          expr: |
            sum by (pod, reason) (increase(loki_write_dropped_entries_total[10m])) > 0
            or
            (
              sum by (pod, reason) (loki_write_dropped_entries_total) > 0
              unless on (pod, reason)
              sum by (pod, reason) (loki_write_dropped_entries_total offset 10m)
            )
          labels:
            notify: mattermost
            severity: warning
          annotations:
            summary: '로그 수집 {{ $labels.pod }} — Loki 로 못 보냈다고 센 로그가 10분 동안 {{ $value | printf "%.0f" }}줄쯤 (사유 {{ $labels.reason }})'
            description: "infra/server/alerts.md 「로그 경보가 오면」"
        # ② 메모리가 상한(256Mi)에 가까움 — 닿으면 OOMKill. Alloy 는 시작할 때 상한의 90% 를 Go 메모리 한도로 스스로 건다(go_gc_gomemlimit_bytes 230.4MiB)
        #   프로그램이 쓰는 메모리(RSS, anon)로 본다 — working set 은 파일 캐시까지 세서 거짓으로 울린다. 2026-11-11 반영 직후 관리 서버 Alloy 가
        #   working set 0.88 로 이 경보를 울렸는데 anon 65.8MiB(0.26) · 파일 캐시 158MiB(그중 실행 파일을 메모리에 올린 것 121.8MiB)였다.
        #   파일 캐시는 커널이 되찾아 OOM 으로 이어지지 않는다. RSS 비율 7일 최대 0.24 ~ 0.29(처음부터 다시 보낸 재현 때 0.294). 85% 15분
        #   양쪽을 max by 로 접는다 — on 으로 짝지으면 kube-state-metrics Pod 가 바뀌는 동안 같은 줄이 둘이 되어 평가 오류가 난다(위 뉴스 수집 경보와 같은 까닭)
        - alert: NewlearnLogShipperMemoryHigh
          expr: |
            max by (namespace, pod, container) (container_memory_rss{namespace="monitoring", container="alloy"})
            /
            max by (namespace, pod, container) (kube_pod_container_resource_limits{namespace="monitoring", container="alloy", resource="memory"})
            > 0.85
          for: 15m
          labels:
            notify: mattermost
            severity: warning
          annotations:
            summary: '로그 수집 {{ $labels.pod }} 프로그램 메모리(RSS)가 상한의 {{ $value | humanizePercentage }}'
            description: "infra/server/alerts.md 「로그 경보가 오면」"
        # ③ 멈춤 — 준비된 Pod 가 노드 수보다 적거나(죽음 · 못 뜸), 떠 있는데 지표 수집이 실패. 그러면 ① ② 도 믿을 수 없다
        #   10분 — 값을 바꿔 노드마다 하나씩 다시 뜨는 동안(약 1분)은 거른다. kube-state-metrics 줄은 ② 와 같은 까닭으로 max by 로 접는다
        - alert: NewlearnLogShipperDown
          expr: |
            max by (namespace, daemonset) (kube_daemonset_status_desired_number_scheduled{namespace="monitoring", daemonset="alloy"})
            - max by (namespace, daemonset) (kube_daemonset_status_number_available{namespace="monitoring", daemonset="alloy"})
            > 0
            or
            up{namespace="monitoring", container="alloy"} == 0
          for: 10m
          labels:
            notify: mattermost
            severity: warning
          annotations:
            summary: 로그 수집 Alloy 가 일부 노드에서 멈췄거나 그 지표를 못 모은다 — 그 노드 로그가 Loki 에 안 쌓일 수 있다
            description: "infra/server/alerts.md 「로그 경보가 오면」"
        # 분석 작업(analysis_job) — 아래 셋 (Jira S15P31A102-215). 근거는 postgres_exporter 의 사용자 정의 질의
        #   (infra/k8s/bootstrap/pg-exporter/queries.yaml)라 backend 에 지표가 없어도 DB 를 직접 센다. 볼 것은 infra/server/alerts.md 「분석 작업 경보가 오면」
        # ① 끝난 실패(다시 걸지 않는 FAILED)가 30분 전보다 늘었다 — 그 기사는 다시 걸리지 않는다(EXTRACT 면 마인드맵이 영영 없다)
        #   지표는 DB 행을 세어 쌓이기만 하고, 질의가 단계마다 늘 한 줄을 내 첫 실패에도 줄이 새로 생기지 않는다 — 그래서 offset 차이로 본다
        #   sum · or vector(0) 을 쓰지 않는다 — 위 상한 경보의 거짓 울림 원인이 or vector(0) 이었다. 한쪽이 비면 결과도 비어 울리지 않는다
        #   한계: exporter 가 30분 넘게 멈춘 동안의 실패(그동안 ③ 이 운다), 30분 안에 누가 끝난 실패를 손으로 되살려(-1) 새 실패(+1)를 가리는 경우
        #   바탕값(2026-11-15): 전 기간 4건, 전부 EXTRACT LLM_OUTPUT_INVALID — 하루 1 ~ 3번 울림 · 풀림 한 쌍. 너무 잦으면 문턱을 올린다
        - alert: NewlearnAnalysisJobFailed
          expr: |
            newlearn_analysis_failed_terminal - newlearn_analysis_failed_terminal offset 30m > 0
          labels:
            notify: mattermost
            severity: warning
          annotations:
            summary: '분석 작업 {{ $labels.stage }} 이 끝내 실패했다 — 30분 동안 {{ $value | printf "%.0f" }}건'
            description: "다시 걸리지 않는 실패다. 어느 기사 · 어떤 오류인지는 infra/server/alerts.md 「분석 작업 경보가 오면」"
        # ② 판정(MATCH_EVENT) · 이슈(ISSUE) 줄이 멈춤 — 한 번에 하나씩이라 하나가 막히면 새 기사 전부가 사건 · 이슈에 안 붙는다
        #   40분은 backend 의 멈춤 WARN(DispatchLine.STUCK_AFTER)과 같은 기준. 그 WARN 이 못 보는 FAILED + retry_at(다시 걸 때가 지났는데 안 걸림)도 본다
        #   🔴 AI 워커의 단계 플래그를 일부러 끄면 소비자가 없어 약 45분 뒤(40분 + for 5m) 이것이 울린다 — 끄는 MR 과 함께 silence 를 건다(alerts.md)
        - alert: NewlearnAnalysisLineStuck
          expr: |
            newlearn_analysis_line_oldest_inflight_seconds > 40 * 60
          for: 5m
          labels:
            notify: mattermost
            severity: critical
          annotations:
            summary: '{{ $labels.stage }} 줄이 {{ $value | humanizeDuration }} 째 멈췄다 — 새 기사가 사건 · 이슈에 안 붙는다'
            description: "infra/server/alerts.md 「분석 작업 경보가 오면」. AI 워커 플래그를 일부러 껐다면 silence 를 건다"
        # ③ 위 두 지표를 못 모음 — 질의가 깨지거나(권한 · 칸 이름) exporter 가 멈추면 ① ② 가 조용히 침묵한다
        #   지표마다 따로 absent 로 본다 — 질의 하나만 깨지면 그 지표만 사라진다(2026-11-15 로컬 시험에서 다른 지표 · pg_up 은 그대로였다)
        #   stage 이름표가 갈려 어느 쪽인지 알림에 나온다. 10분 — exporter 를 다시 띄우는 동안(Recreate)은 거른다
        - alert: NewlearnAnalysisMetricsMissing
          expr: |
            absent(newlearn_analysis_failed_terminal{stage="EXTRACT"})
            or
            absent(newlearn_analysis_line_oldest_inflight_seconds{stage="MATCH_EVENT"})
          for: 10m
          labels:
            notify: mattermost
            severity: warning
          annotations:
            summary: '분석 작업 지표 하나를 못 모은다(stage {{ $labels.stage }} — EXTRACT 는 실패 수, MATCH_EVENT 는 줄 멈춤) — 위 두 경보를 믿을 수 없다'
            description: "kubectl -n monitoring logs deploy/postgres-exporter 에서 queryNamespaceMappings 오류를 본다. 질의 · 권한은 infra/k8s/bootstrap/pg-exporter/"
