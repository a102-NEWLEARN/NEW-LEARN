# 다른 Pod 에서 Alertmanager Pod 로 들어오는 길 — 같은 네임스페이스 Prometheus · Grafana 만 (Jira S15P31A102-139)
# Alertmanager API(9093)는 인증이 없다. 정책이 없으면 클러스터 안 어느 Pod 든(CI 잡 · 시험 Pod 등) 닿아
# 진짜 경보를 꺼 두거나(silence) notify=mattermost 가짜 경보를 팀 채널에 올릴 수 있다
# 받는 길(2026-10-30 확인):
#   Prometheus → 9093(경보 보내기 · 지표 수집 /metrics), 8080(설정 다시 읽기 곁 컨테이너의 /metrics) — 차트가 만든 ServiceMonitor
#   Grafana → 9093 — 차트가 넣은 자료원 「Alertmanager」(경보 화면에서 경보 · silence 를 본다)
# 9094(Alertmanager 끼리 묶는 통신)는 한 대라 꺼져 있다(--cluster.listen-address=) — 열지 않는다
# 그대로 남는 길:
#   - 관리 서버(Alertmanager 가 뜬 노드) 호스트에서 오는 것 — Cilium 은 로컬 호스트 통신을 기본으로 허용한다
#     kubelet 상태 확인, API 서버 서비스 프록시(infra/server/alerts.md 「확인」의 kubectl get --raw …/proxy/…)
#     https://docs.cilium.io/en/v1.20/security/policy/layer3/ 「Entities Based」 host
#     API 서버 프록시가 열려 있는 것은 Alertmanager 가 API 서버와 같은 관리 서버에 있어서다(monitoring-values.yaml 의 nodeSelector) — 워커로 옮기면 그 확인 명령이 막힌다
#   - 곁 컨테이너가 설정을 다시 읽으라고 부르는 것 — 같은 Pod 의 localhost
# 이름표는 차트(kube-prometheus-stack 92.10.1)와 operator 가 붙인다 — 판을 올리면 다시 본다. 틀렸을 때 결과는 셋으로 갈린다
#   - endpointSelector 가 틀리면 아무 Pod 도 고르지 않아 보호가 소리 없이 사라진다(경보는 돈다)
#   - Prometheus 쪽이 틀리면 경보가 소리 없이 끊긴다 — 그 사실을 알리는 기본 경보(PrometheusNotConnectedToAlertmanagers 등)도
#     받는 곳이 null 이라 채널에 안 온다. 반영 뒤 Prometheus 의 /api/v1/alertmanagers 와 prometheus_notifications_* 로 확인한다(alerts.md)
#   - Grafana 쪽이 틀리면 Grafana 경보 화면의 Alertmanager 자료원만 안 열린다
# 네임스페이스 이름표가 없는 규칙은 이 정책의 네임스페이스(monitoring)로 한정된다 — 다른 네임스페이스에서 이름표를 흉내 내도 못 들어온다
#   https://docs.cilium.io/en/v1.20/security/policy/kubernetes/ 「Namespaces」
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager-ingress
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
