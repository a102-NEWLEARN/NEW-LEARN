# 운영 이미지의 nginx 설정 (frontend/Dockerfile). API(/api)는 Envoy Gateway 가 backend 로 보내서 여기 오지 않는다
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # 응답 머리에 문자셋을 붙인다 (Lighthouse charset, Jira S15P31A102-218). 빌드 때 SEED 테마 script 가
    # <meta charset> 앞에 들어가 첫 1024바이트 밖으로 밀린다. 기본 charset_types 라 HTML · robots.txt(text/plain)에 붙는다
    charset utf-8;

    # 글자 파일은 gzip 으로 줄여 보낸다 (Jira S15P31A102-32). 압축 없이 JS 779KB 를 그대로 보내서
    # 폰(느린 4G · CPU 4배 느리게)에서 첫 화면까지 6.4초 걸렸다. text/html 은 nginx 가 늘 넣는다.
    # 그림 · 글꼴(png · woff2)은 이미 압축돼 있어 넣지 않는다. 앞단 Envoy 를 거쳐 와도 줄이게 proxied any
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/javascript text/javascript text/css application/json application/manifest+json image/svg+xml text/plain;

    # 화면 주소(/issues/1 같은)를 바로 열거나 새로고침하면 파일이 없다 — index.html 을 주고 화면이 길을 찾는다
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 은 새 배포를 바로 받게 캐시하지 않는다. 나머지 파일은 이름에 내용 해시가 붙어(Vite) 오래 둔다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 폰 홈 화면 설치(PWA, Jira S15P31A102-176) — 서비스 워커 · manifest · 오프라인 안내는 이름이 그대로라
    # 새 배포를 바로 받게 캐시하지 않는다. manifest 는 nginx 판에 따라 형식을 모를 수 있어 직접 적는다
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /offline.html {
        add_header Cache-Control "no-cache";
    }
}
